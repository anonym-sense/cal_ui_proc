<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>Calligraphy City</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  html, body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: manipulation; }
  #panel {
    position: fixed; left: 16px; bottom: 16px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    max-width: calc(100vw - 32px); box-sizing: border-box;
    padding: 10px 14px; border-radius: 14px;
    font: 13px/1.2 Georgia, "Times New Roman", serif; color: #fff;
    background: rgba(12, 14, 30, .42); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, .18);
    opacity: .45; transition: opacity .3s;
  }
  #panel:hover, #panel:focus-within { opacity: 1; }
  #menu { display: none; margin-left: auto; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; }
  /* phones and touch screens: a one-line bar that opens into full-width, finger-sized controls */
  @media (max-width: 700px), (max-height: 500px), (pointer: coarse) {
    #panel {
      left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right));
      bottom: max(8px, env(safe-area-inset-bottom)); max-width: none;
      gap: 8px; padding: 8px 10px; opacity: .8;
    }
    #panel.open { opacity: 1; background: rgba(12, 14, 30, .72); }
    #menu { display: inline-block; }
    #panel:not(.open) > :not(#clock):not(#phase):not(#menu) { display: none; }
    #clock { font-size: 18px; }
    #time { order: 1; flex: 1 0 100%; width: auto; height: 32px; margin: 0; }
    #panel.open > button:not(#menu) { order: 2; flex: 1 1 40%; min-height: 40px; }
    #menu { min-height: 36px; padding: 5px 14px; }
  }
  #clock { font-size: 20px; letter-spacing: .04em; font-variant-numeric: tabular-nums; min-width: 3.2em; }
  #phase { font-style: italic; opacity: .85; min-width: 6.5em; }
  #time { width: 160px; accent-color: #ffcf7a; }
  button {
    font: inherit; color: inherit; cursor: pointer;
    padding: 5px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .3);
  }
  button:hover { background: rgba(255, 255, 255, .22); }
  button.on { background: #ffcf7a; color: #2a1a10; border-color: #ffcf7a; }
  #distort { border-color: #b79cff; background: rgba(140, 100, 255, .22); }
  #distort:hover { background: rgba(140, 100, 255, .45); }
  /* once the scene is gone, only the way back is left */
  #panel.void { background: none; border-color: transparent; backdrop-filter: none; right: auto; }
  #panel.void > :not(#distort) { display: none !important; }
  #panel.void > #distort { display: inline-block !important; flex: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel">
  <span id="clock">--:--</span>
  <span id="phase"></span>
  <button id="menu" aria-expanded="false" aria-controls="panel">Controls</button>
  <input id="time" type="range" min="0" max="24" step="0.01" aria-label="Time of day">
  <button id="live" class="on" title="Follow the real clock (L)">Live</button>
  <button id="cycle" title="Play a whole day in one minute (C)">Day cycle</button>
  <button id="season" title="Cycle the season: auto follows the calendar (S)">Season</button>
  <button id="rain" title="Rain; umbrellas go up along the pavements (W)">Rain</button>
  <button id="snow" title="Snowfall; roofs and streets turn white as it settles (N)">Snow</button>
  <button id="xmas" title="Christmas lights, garlands across the street and the great tree (X)">Christmas lights</button>
  <button id="fire" class="on" title="Fireworks over the city after dark (F)">Night fireworks</button>
  <button id="regen" title="Generate a new city (R)">New city</button>
  <button id="distort" title="Break the glass and let a black hole take the city (D)">Distort</button>
</div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- procedural noise ---------- */
// 1D gradient (Perlin) noise, output roughly in [-1, 1]
function makeNoise(seed) {
  const r = mulberry32(seed), g = new Float32Array(512);
  for (let i = 0; i < 512; i++) g[i] = r() * 2 - 1;
  return x => {
    const i = Math.floor(x), f = x - i;
    const w = f * f * f * (f * (f * 6 - 15) + 10);
    const a = g[i & 511] * f, b = g[(i + 1) & 511] * (f - 1);
    return (a + (b - a) * w) * 2;
  };
}
function fbm(n, x, oct, gain) {
  let s = 0, a = 1, f = 1, tot = 0;
  for (let o = 0; o < oct; o++) { s += a * n(x * f + o * 17.3); tot += a; a *= gain; f *= 2; }
  return s / tot;
}
// ridged multifractal: sharp crests, in [0, 1]
function ridged(n, x, oct, gain) {
  let s = 0, a = 1, f = 1, tot = 0;
  for (let o = 0; o < oct; o++) {
    const v = 1 - Math.abs(n(x * f + o * 31.7));
    s += a * v * v; tot += a; a *= gain; f *= 2.1;
  }
  return s / tot;
}

/* ---------- time-of-day palette ---------- */
const NIGHT = { top: '#050818', mid: '#0d1436', hor: '#1f2a5c', far: '#3a4682', midc: '#232c60', near: '#0c1030', ink: '#03040c', haze: '#3b4a8a', light: .12, stars: 1 };
const KEYS = [
  { t: 0, ...NIGHT },
  { t: 4.5, top: '#0a1030', mid: '#1c2456', hor: '#4b3f78', far: '#544f8c', midc: '#2e2d62', near: '#121233', ink: '#05050f', haze: '#5a5596', light: .18, stars: .8 },
  { t: 6, top: '#33508f', mid: '#b07aa6', hor: '#ffb27a', far: '#e09aa6', midc: '#9a5f8f', near: '#3d2857', ink: '#1a1030', haze: '#ffc9a0', light: .55, stars: .1 },
  { t: 7.5, top: '#5a9bd8', mid: '#a9d3ee', hor: '#ffe6b8', far: '#b9cfe8', midc: '#7fb6a4', near: '#3e7a5c', ink: '#173226', haze: '#fff0d0', light: .9, stars: 0 },
  { t: 12, top: '#2f86d6', mid: '#7cc0ee', hor: '#d6effa', far: '#a7c8ea', midc: '#5fb08e', near: '#2c8050', ink: '#10301f', haze: '#e8f6fb', light: 1, stars: 0 },
  { t: 16, top: '#3d87c8', mid: '#93c4e4', hor: '#f6e6bd', far: '#b3bfd9', midc: '#7aa97a', near: '#4b7d3c', ink: '#1c2f14', haze: '#fbeecb', light: .95, stars: 0 },
  { t: 18, top: '#34397a', mid: '#c8607a', hor: '#ff9248', far: '#f0a078', midc: '#b24f78', near: '#42204a', ink: '#1a0b22', haze: '#ffb070', light: .5, stars: .1 },
  { t: 19.5, top: '#141a48', mid: '#4a3a7a', hor: '#8a5484', far: '#6a5a98', midc: '#3c3270', near: '#18143a', ink: '#07061a', haze: '#7a5e9a', light: .22, stars: .7 },
  { t: 21, ...NIGHT },
  { t: 24, ...NIGHT },
].map(k => {
  const o = { t: k.t, light: k.light, stars: k.stars };
  for (const f of COLS()) o[f] = hex(k[f]);
  return o;
});
function COLS() { return ['top', 'mid', 'hor', 'far', 'midc', 'near', 'ink', 'haze']; }

function paletteAt(t) {
  let k = 0;
  while (k < KEYS.length - 2 && KEYS[k + 1].t <= t) k++;
  const a = KEYS[k], b = KEYS[k + 1], f = smooth(0, 1, (t - a.t) / (b.t - a.t));
  const P = { t, light: lerp(a.light, b.light, f), stars: lerp(a.stars, b.stars, f) };
  for (const c of COLS()) P[c] = mix(a[c], b[c], f);
  P.lit = clamp((.5 - P.light) / .25, 0, 1);       // how far the city lights have come on
  P.night = smooth(.3, .2, P.light);               // 1 once it is properly dark
  return P;
}
function phaseName(t) {
  return t < 4.5 ? 'night' : t < 6 ? 'before dawn' : t < 8 ? 'sunrise' : t < 11 ? 'morning' :
    t < 14 ? 'midday' : t < 17 ? 'afternoon' : t < 18.8 ? 'sunset' : t < 20.5 ? 'dusk' : 'night';
}

/* ---------- object colours ---------- */
const WALLS = ['#f6efe0', '#fbf7ee', '#f7e3a0', '#f2c9b8', '#cfe3ee', '#d6ecd2', '#f3d9c4', '#e9a7a0'].map(hex);       // houses
const BRICK = ['#c9785a', '#d9a37c', '#e8dcc4', '#b9bfc6', '#d4b48a', '#a85f4a', '#e3c9a8', '#9fb0b8', '#f0e6d2'].map(hex);   // mid-rise blocks
const TOWERS = ['#8fa9bf', '#a9b9c6', '#7f95ad', '#c9c2b4', '#9aa7a0', '#b3a6a0', '#6f8aa6'].map(hex);                 // glass and stone towers
const ROOFS = ['#b8392e', '#2f7d5a', '#3f6fa8', '#8a4a2e', '#6a6f78', '#c2452f', '#356a8a'].map(hex);
const AWNINGS = ['#c2452f', '#2f7d5a', '#3f6fa8', '#e0a030', '#8a4fc0'].map(hex);
const CARS = ['#c8352b', '#f0b429', '#3a78d0', '#f4f1e8', '#22a08a', '#2c2c34', '#8a8f98', '#e2622f'].map(hex);
const GOLD = hex('#eab92d'), WINDOW = hex('#231a24'), GLASS = hex('#20303f'), WHITEWASH = hex('#faf6ec'), SNOW_OBJ = hex('#f2f6fb');
const XMAS = ['#ff3b30', '#35d04f', '#ffd21f', '#3a8bff', '#ff5fc0'].map(hex);
const PINES = ['#1f5a44', '#2a6b4a', '#235a3c', '#35764a'].map(hex);
const CEDARS = ['#17463f', '#1c4f52', '#1f5548', '#14403a'].map(hex);
const ASPEN_BARK = hex('#ece7d8'), ASPHALT = hex('#4b4e58');
const hexes = o => { for (const k in o) if (o[k]) o[k] = o[k].map(hex); return o; };
// broadleaf and aspen foliage by season; null = bare branches
const LEAF = {
  round: hexes({ spring: ['#7cc65a', '#9ad36a', '#f2a0b8', '#e8607a', '#f6c6d0', '#8fd070'], summer: ['#3f9050', '#5aa64a', '#2f8048', '#6fae3c'], autumn: ['#e0892c', '#d4552f', '#e8b830', '#b8432a', '#c9a030'], winter: null }),
  aspen: hexes({ spring: ['#a8d86a', '#bfe07a', '#9fd060'], summer: ['#7cba4a', '#8cc65a', '#6fae48'], autumn: ['#f2c230', '#f6d048', '#eea820', '#f0b838'], winter: null }),
};
// ground cover by season, applied over the time-of-day colours (summer keeps the base greens)
const SEASON = {
  spring: { midc: hex('#8ecf86'), near: hex('#58a650'), k: .5 },
  summer: null,
  autumn: { midc: hex('#c8a45c'), near: hex('#a06c30'), k: .6 },
  winter: { midc: hex('#a3a892'), near: hex('#7c7a5e'), k: .6 },
};
const SNOWLINE = { spring: .34, summer: .28, autumn: .31, winter: .52 };   // fraction of screen height
const CLOTHES = ['#b02a30', '#f0b429', '#3a78d0', '#f4f1e8', '#8a4fc0', '#22a08a', '#e2622f'].map(hex);
const DOGS = ['#8a5a34', '#2c2420', '#e9e2d2', '#c79a5c', '#6b6b6b'].map(hex);
const SKIN = hex('#e8b890'), HAIR = hex('#2a1c18'), WOOD = hex('#5a3a28'), WARM = hex('#ffcf6a'), COOL = hex('#dfeaff'), WHITE = hex('#ffffff');

/* ---------- scene state ---------- */
const cv = document.getElementById('scene'), main = cv.getContext('2d');
const sc = document.createElement('canvas'), sctx = sc.getContext('2d');   // the scene is painted here while the glass is broken
let ctx = main;
const qs = new URLSearchParams(location.search);
let seed = qs.has('seed') ? +qs.get('seed') | 0 : (Math.random() * 1e9) | 0;
let override = qs.has('t') ? clamp(+qs.get('t'), 0, 24) % 24 : null;   // null = live clock
let cycling = false, fireworksOn = true;
let W, H, u, cam, mounts, blds, objs, people, cars, stars, clouds, storm, birds;
const fw = { rockets: [], sparks: [], flashes: [], next: .5 };
const NIB = [Math.cos(40 * Math.PI / 180), Math.sin(40 * Math.PI / 180)];  // broad-nib pen angle

const yAt = (L, x) => {
  x = clamp(x, 0, W);
  const i = x | 0, f = x - i;
  return L.ys[i] + (L.ys[Math.min(W, i + 1)] - L.ys[i]) * f;
};
const slopeAt = (L, x) => { const g = 8 * u; return (yAt(L, x + g) - yAt(L, x - g)) / (2 * g); };

// Broad-nib stroke: a fixed-angle pen edge swept along the path, so the line
// swells on up-strokes and thins on down-strokes like pen calligraphy.
function nibStroke(pts, wf) {
  const p = new Path2D(), n = pts.length;
  for (let i = 0; i < n; i++) {
    const w = wf(i / (n - 1), pts[i]);
    const x = pts[i][0] - NIB[0] * w * .25, y = pts[i][1] - NIB[1] * w * .25;
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  for (let i = n - 1; i >= 0; i--) {
    const w = wf(i / (n - 1), pts[i]);
    p.lineTo(pts[i][0] + NIB[0] * w * .75, pts[i][1] + NIB[1] * w * .75);
  }
  p.closePath();
  return p;
}

/* ---------- seasons, snow, Christmas lights ---------- */
const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
const autoSeason = () => ['winter', 'winter', 'spring', 'spring', 'spring', 'summer', 'summer', 'summer', 'autumn', 'autumn', 'autumn', 'winter'][new Date().getMonth()];
let seasonSel = SEASONS.includes(qs.get('season')) ? qs.get('season') : 'auto';
const season = () => seasonSel === 'auto' ? autoSeason() : seasonSel;
let snowOn = qs.has('snow') ? qs.get('snow') === '1' : season() === 'winter';
let xmasOn = qs.has('xmas') ? qs.get('xmas') === '1' : new Date().getMonth() === 11;
let cover = snowOn ? 1 : 0, fall = cover, flakes = [];      // snow on the ground / in the air, 0..1

// Rain days: decided once per calendar day, likeliest in summer.
const rainyToday = () => {
  const d = new Date(), roll = mulberry32(d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate())();
  return roll < { spring: .25, summer: .5, autumn: .25, winter: 0 }[season()];
};
let rainOn = qs.has('rain') ? qs.get('rain') === '1' : !snowOn && rainyToday();
let wet = rainOn ? 1 : 0, drops = [];

/* ---------- the distortion: broken glass, then a black hole ---------- */
const dz = { on: false, t: 0, gen: 0, restoring: 0, hx: 0, hy: 0, Rf: 1, maxD: 1, tEnd: 16.5, shards: [], cracks: [], bits: [] };
const flying = [];                                         // things torn loose this frame, drawn over the glass
const CRACK = .9, GONE = 1;
// when each kind of thing lets go: [earliest second, extra seconds at the far corner]
const SUCK = { person: [2.2, 3], car: [2.4, 3], santa: [3.3, 0], lamp: [3.4, 3.4], garland: [3.2, 3.4], tree: [3.6, 3.4], snowman: [3, 3], bld: [4.8, 4] };

// The fall into the hole: a tightening spiral, stretched along the radius.
function spiral(ox, oy, p, j, ax, ay) {
  const e = Math.pow(p, 2.3), dx = ox - dz.hx, dy = oy - dz.hy;
  const r = Math.hypot(dx, dy) * Math.pow(1 - e, 1.1), turn = (2.2 + 1.6 * j) * Math.pow(e, 1.4), a = Math.atan2(dy, dx) + turn;
  return { x: dz.hx + Math.cos(a) * r, y: dz.hy + Math.sin(a) * r, a, rot: turn, k: 1 - .82 * e, st: 1 + 2.2 * e, ax, ay };
}
function applySuck(s) {
  ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.scale(s.st, 1 / Math.sqrt(s.st));
  ctx.rotate(s.rot - s.a); ctx.scale(s.k, s.k); ctx.translate(-s.ax, -s.ay);
}
function suck(o, ax, ay) {
  if (o._g !== dz.gen) { o._g = dz.gen; o._j = Math.random(); o._ox = null; }
  if (o._ox === null) {
    const T = SUCK[o.type] || SUCK.tree, dn = Math.min(1, Math.hypot(ax - dz.hx, ay - dz.hy) / dz.maxD), tr = T[0] + T[1] * dn + o._j * .7;
    if (dz.t < tr) return null;
    o._ox = ax; o._oy = ay; o._t0 = tr; o._dur = 1.5 + 1.3 * dn;
  }
  const p = (dz.t - o._t0) / o._dur;
  return p >= 1 ? GONE : spiral(o._ox, o._oy, p, o._j, ax, ay);
}

/* ---------- world generation ---------- */
// The view is a one-point perspective down a street. World units are metres: X across
// the street, Y up, Z away from the eye; everything converges on the vanishing point.
const px = (X, Z) => cam.cx + cam.f * X / Z;
const py = (Y, Z) => cam.hy + cam.f * (cam.h - Y) / Z;
const UNIT = .15;                                          // one sprite unit, in metres
const place = o => { const k = cam.f / o.Z; o.x = px(o.X, o.Z); o.y = py(0, o.Z); o.L.s = k * UNIT; return o; };
const quad = (x1, y1, x2, y2, x3, y3, x4, y4) => { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); };

// Everything inked on a ridge line: the silhouette, the broad-nib stroke, a hairline and two echoes.
function inkLayer(L, wMax, gap0) {
  L.fill = new Path2D();
  L.fill.moveTo(0, H);
  for (let x = 0; x <= W; x += 2) L.fill.lineTo(x, L.ys[x]);
  L.fill.lineTo(W, L.ys[W]); L.fill.lineTo(W, H); L.fill.closePath();
  const ridge = [];
  for (let x = -6; x <= W + 6; x += 3) ridge.push([x, yAt(L, x) + 1]);
  L.ridge = nibStroke(ridge, (t, p) => wMax * smooth(-.5, .3, L.nB(p[0] / H * 2.6 + 9)));
  L.hair = new Path2D();
  ridge.forEach((p, k) => k ? L.hair.lineTo(p[0], p[1]) : L.hair.moveTo(p[0], p[1]));
  L.echo = [];
  for (let e = 1; e <= 2; e++) {
    const pts = [];
    for (let x = -6; x <= W + 6; x += 4) { const y = yAt(L, x); pts.push([x, y + gap0 * e + (L.base - y) * .1 * e]); }
    L.echo.push(nibStroke(pts, (t, p) => wMax * (.5 / e) * smooth(.05, .6, L.nB(p[0] / H * 1.7 + 40 * e + 3))));
  }
}

function build() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.ceil(window.innerWidth); H = Math.ceil(window.innerHeight);
  for (const [c, x] of [[cv, main], [sc, sctx]]) { c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
  u = Math.max(.45, Math.min(H, W * 1.25) / 800);        // drawing unit: sized for the short side
  const rng = mulberry32(seed);
  const pick = arr => arr[(rng() * arr.length) | 0];
  fw.rockets.length = fw.sparks.length = fw.flashes.length = 0;

  // the eye: above the middle of the road, raised on narrow screens so both pavements stay in view
  cam = { cx: W * lerp(.47, .53, rng()), hy: H * .52, f: H * .9, B: 11, RW: 5, zf: 200, isle: 74, tint: [rng() * 14 - 7, rng() * 14 - 7, rng() * 14 - 7] };
  cam.h = clamp(cam.B * (H - cam.hy) / (W / 2) * 1.15, 9, 18);
  cam.z0 = cam.f * cam.h / (H - cam.hy);                   // the depth at which the ground meets the bottom of the screen

  const TREE_H = { pine: [22, 42], cedar: [40, 64], aspen: [34, 50], round: [24, 38] };
  const treeP = (kind, hs, o) => Object.assign({ kind, v: rng() * .999, h: lerp(TREE_H[kind][0], TREE_H[kind][1], rng()) * hs, r: rng(), xmas: kind === 'pine' || kind === 'cedar' }, o);

  /* --- the snow range the street runs toward --- */
  mounts = [];
  for (let i = 0; i < 3; i++) {
    const d = i / 2, nA = makeNoise(seed + i * 101 + 1), nB = makeNoise(seed + i * 101 + 2);
    const L = {
      i, d, nB, s: u * lerp(.26, .4, d), base: cam.hy + H * lerp(-.01, .03, d), amp: H * lerp(.4, .16, d),
      tint: [rng() * 18 - 9, rng() * 18 - 9, rng() * 18 - 9], ys: new Float32Array(W + 1), objs: [],
    };
    const freq = lerp(1.3, 1.05, d), off = rng() * 200;
    let top = H;
    for (let x = 0; x <= W; x++) {
      const xn = x / H * freq + off;
      const jag = ridged(nA, xn * .9, 5, .5) * 1.5 - .55, soft = fbm(nA, xn, 4, .4) * .9;
      // the range stands tallest at the end of the street, where the buildings leave it in view
      const v = lerp(jag, soft, d * .45) + nB(xn * .35 + 50) * .5 + .32 * smooth(.38, 0, Math.abs(x - cam.cx) / H);
      const y = L.base - L.amp * v;
      L.ys[x] = y; if (y < top) top = y;
    }
    L.top = top;
    inkLayer(L, u * lerp(8, 13, d), u * lerp(24, 18, d));
    if (i === 2) for (let x = rng() * 8 * L.s; x < W; x += L.s * lerp(4, 10, rng())) {     // forest on the nearest slopes
      const yr = yAt(L, x);
      if (Math.abs(slopeAt(L, x)) > .6 || yr < H * .36) continue;
      if (rng() > smooth(-.3, .25, fbm(nB, x / H * 1.6 + 300, 3, .5)) * .9 + .05) continue;
      L.objs.push(Object.assign({ type: 'tree', x, y: yr + Math.pow(rng(), 1.4) * 44 * L.s }, treeP(nB(x / H * 1.3 + 700) > 0 ? 'cedar' : 'pine', 1, { xmas: false })));
    }
    L.objs.sort((a, b) => a.y - b.y);
    mounts.push(L);
  }
  buildCaps();

  /* --- buildings down both sides of the street, block after block, with towers further on --- */
  blds = []; objs = []; people = []; cars = [];
  const doors = { '-1': [], '1': [] };
  const crosses = [lerp(52, 62, rng()), lerp(112, 124, rng()), lerp(182, 196, rng())], CW = 9;   // cross streets
  const inCross = (z, m) => crosses.some(c => z > c - m && z < c + CW + m);
  for (const side of [-1, 1]) {
    let z = cam.z0 * .4, prev = null;
    while (z < cam.zf) {
      const bar = crosses.find(c => c + CW > z);
      let len = lerp(8, 17, rng());
      if (bar !== undefined && z + len > bar) len = bar - z;
      if (len < 5) { z = bar + CW; prev = null; continue; }
      const tower = z > 70 && rng() < .28;
      const h = tower ? lerp(26, 46, rng()) : lerp(8, z < 60 ? 15 : 21, rng()), fl = tower ? 3.5 : 3.2, G = 4.2;
      const rows = Math.max(1, Math.floor((h - G - .6) / fl)), cols = Math.max(1, Math.round(len / lerp(3, 4.2, rng())));
      const w = tower ? lerp(16, 26, rng()) : 70, colsF = Math.min(8, Math.floor(Math.min(w, 28) / 3.6));
      const o = {
        type: 'bld', side, z1: z, z2: z + len, h, w, tower, fl, G, rows, cols, colsF,
        fy0: prev === null ? 0 : h > prev.h + 2 ? prev.h : 1e9,      // how much of the end wall shows past the nearer building
        wall: pick(tower ? TOWERS : rng() < .5 ? BRICK : WALLS), roof: pick(ROOFS), awn: pick(AWNINGS), glow: tower && rng() < .45 ? COOL : WARM,
        shop: !tower && rng() < .65, doorC: (rng() * cols) | 0,
        lit: Array.from({ length: rows * cols }, () => rng() * (tower ? 1.7 : 1.3)), litF: Array.from({ length: rows * colsF }, () => rng() * 1.5), r: rng(),
      };
      const za = Math.max(o.z1, cam.z0);
      o.x = clamp(px(side * cam.B, za), 0, W); o.y = Math.min(H, py(0, za));
      blds.push(o);
      const zd = o.z1 + (o.doorC + .5) * len / cols;
      if (zd > cam.z0 * 1.25 && zd < 150) doors[side].push(zd);
      prev = o; z += len;
    }
  }
  blds.sort((a, b) => b.z1 - a.z1);                        // painted from the far end of the street forward

  /* --- the street: lamp posts with garlands strung across, trees, the great tree on its island, snowmen --- */
  const item = (type, X, Z, o) => place(Object.assign({ type, X, Z, L: { s: 1 } }, o));
  for (let z = cam.z0 * .8; z < cam.zf - 20; z += 20) {
    if (inCross(z, 2)) continue;
    const a = item('lamp', -(cam.RW + .7), z, { h: 40 }), b = item('lamp', cam.RW + .7, z, { h: 40 });
    objs.push(a, b, { type: 'garland', a, b, Z: z - .01, r: rng(), L: a.L, x: (a.x + b.x) / 2, y: a.y - 30 * a.L.s });
  }
  for (const side of [-1, 1]) for (let z = cam.z0 * .9 + rng() * 8; z < cam.zf - 25; z += lerp(8, 17, rng())) {
    if (inCross(z, 1)) continue;
    objs.push(item('tree', side * (cam.RW + 2.3), z, treeP(pick(['round', 'round', 'aspen', 'aspen', 'pine', 'cedar']), .8)));
  }
  objs.push(item('tree', 0, cam.isle, treeP('cedar', 1, { h: 95 })));
  objs.push(item('snowman', -7.7, cam.z0 * 1.5, { r: rng() }), item('snowman', 7.5, cam.z0 * 2.4, { r: rng() }));

  /* --- people on the pavements: townsfolk going door to door, travellers walking the whole street --- */
  const person = (X, Z, o) => item('person', X, Z, Object.assign({
    ph: rng() * 6, tz: Z, vz: -1, wait: rng() * 4, moving: false, dir: 1, speed: lerp(.9, 1.6, rng()),
    col: pick(CLOTHES), lantern: rng() < .6, size: lerp(.9, 1.15, rng()),
    dog: rng() < .32 ? pick(DOGS) : null, runner: rng() < .35, brolly: pick(CLOTHES),
  }, o));
  for (const side of [-1, 1]) {
    const dl = doors[side];
    if (dl.length > 1) for (let n = 0; n < 9; n++) people.push(person(side * lerp(cam.RW + 1.2, cam.B - .6, rng()), pick(dl), { doors: dl }));
  }
  for (let g = 0; g < 8; g++) {
    const n = 1 + (rng() * 3 | 0), side = rng() < .5 ? -1 : 1, vz = rng() < .5 ? -1 : 1, speed = lerp(1, 1.5, rng()), z0 = lerp(cam.z0, 160, rng() * rng()), X0 = lerp(7, 9.4, rng());
    for (let k = 0; k < n; k++) people.push(person(side * (X0 + (k - (n - 1) / 2) * .75), z0 + k * .35, { doors: null, vz, speed, moving: true }));
  }

  /* --- traffic: the left lane comes toward the eye, the right lane drives away --- */
  for (const [X, vz] of [[-2.6, -1], [2.6, 1]]) {
    for (let k = 0; k < 5; k++) {
      const bus = k === 0 && vz > 0 && rng() < .7;
      cars.push(item('car', X, lerp(cam.z0 * .5, 185, (k + rng() * .6) / 5), {
        vz, speed: lerp(8, 10, rng()), bus, len: bus ? 10 : lerp(3.9, 4.6, rng()), wd: bus ? 2.5 : 1.9, ht: bus ? 3.1 : lerp(1.4, 1.6, rng()),
        col: pick(CARS), tree: rng() < .45, r: rng(),
      }));
    }
  }

  /* --- the two kerbs: the /\ of the picture, each one heavy pen stroke thinning toward the vanishing point --- */
  const zb = cam.z0 * .45, zAt = t => zb * Math.pow(cam.zf * 4 / zb, t), nK = makeNoise(seed + 77);
  cam.kerbs = [-1, 1].map(sd => {
    const pts = [];
    for (let i = 0; i <= 70; i++) { const z = zAt(i / 70); pts.push([px(sd * cam.RW, z), py(0, z)]); }
    return nibStroke(pts, t => clamp(cam.f * .34 / zAt(t), .5, 15 * u) * smooth(-1.5, .3, nK(t * 9 + sd * 3)));
  });

  stars = Array.from({ length: 260 }, () => ({ x: rng(), y: rng() * .75, r: lerp(.5, 1.6, rng() * rng()), ph: rng() * 6.28, sp: lerp(.6, 2.4, rng()) }));
  clouds = Array.from({ length: 7 }, () => {
    const n = 4 + (rng() * 4 | 0), blobs = [];
    for (let k = 0; k < n; k++) blobs.push({ dx: (k - n / 2) * 26 + rng() * 14, dy: -rng() * 12, r: lerp(16, 34, rng()) * (1 - Math.abs(k - (n - 1) / 2) / n) });
    return { x: rng() * 1.4 - .2, y: lerp(.04, .26, rng()), sc: lerp(.7, 1.7, rng()), sp: lerp(.002, .006, rng()), blobs };
  });
  storm = Array.from({ length: 15 }, (_, k0) => {            // the overcast that rolls in with rain or snow
    const n = 6 + (rng() * 4 | 0), blobs = [];
    for (let k = 0; k < n; k++) blobs.push({ dx: (k - n / 2) * 30 + rng() * 16, dy: -rng() * 16, r: lerp(26, 46, rng()) * (1 - Math.abs(k - (n - 1) / 2) / n * .7) });
    return { x: k0 / 15 * 1.6 + rng() * .08, y: lerp(.0, .24, rng()), sc: lerp(1.5, 2.8, rng()), sp: lerp(.004, .009, rng()), blobs };
  });
  birds = Array.from({ length: 6 }, () => ({ x: rng(), y: lerp(.08, .3, rng()), sp: lerp(.012, .025, rng()), ph: rng() * 6.28, sz: lerp(.7, 1.3, rng()) }));
  const dense = clamp(W * H / 1.12e6, .3, 1);              // fewer particles on small screens
  drops = Array.from({ length: Math.round(420 * dense) }, () => ({ x: rng() * W * 1.2, y: rng() * H, len: lerp(10, 24, rng()) * u, v: lerp(620, 900, rng()) * u }));
  flakes = Array.from({ length: Math.round(450 * dense) }, () => { const k = rng() * rng(); return { x: rng() * W, y: rng() * H, r: lerp(.8, 2.6, k) * u, v: lerp(28, 75, k) * u, ph: rng() * 6.28 }; });
  if (dz.on) layoutDistort();
}

// Permanent snow on whatever stands above the season's snowline: a cap hanging
// from the ridge with a ragged lower edge.
function buildCaps() {
  const sy = H * SNOWLINE[season()];
  for (const L of mounts) {
    L.cap = null;
    const low = [];
    let any = false;
    const p = new Path2D();
    for (let x = 0; x <= W; x += 3) {
      const yr = L.ys[x], above = sy - yr;
      if (above > 0) any = true;
      low.push([x, yr + Math.max(0, above) * (.35 + .3 * (.5 + .5 * L.nB(x / H * 34 + 7)))]);
      x ? p.lineTo(x, yr) : p.moveTo(x, yr);
    }
    for (let k = low.length - 1; k >= 0; k--) p.lineTo(low[k][0], low[k][1]);
    p.closePath();
    if (any) L.cap = p;
  }
}

/* ---------- drawing ---------- */
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, css(col, a)); g.addColorStop(1, css(col, 0));
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = 'source-over';
}
// cheap lamp glow: one pre-rendered warm sprite, stamped additively
let lampSprite;
function lampGlow(x, y, r, a) {
  if (!lampSprite) {
    lampSprite = document.createElement('canvas'); lampSprite.width = lampSprite.height = 64;
    const c = lampSprite.getContext('2d'), g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, css(WARM, 1)); g.addColorStop(.3, css(WARM, .42)); g.addColorStop(1, css(WARM, 0));
    c.fillStyle = g; c.fillRect(0, 0, 64, 64);
  }
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
  ctx.drawImage(lampSprite, x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawSky(P, t, time) {
  const g = ctx.createLinearGradient(0, 0, 0, H * .6);
  g.addColorStop(0, css(P.top)); g.addColorStop(.55, css(P.mid)); g.addColorStop(1, css(P.hor));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (P.stars > .01) {
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = P.stars * (.45 + .55 * Math.sin(time * s.sp + s.ph)) * (1 - s.y * .6);
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * u, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const hy = H * .6;
  if (t > 5.3 && t < 18.7) {                              // sun: rises 6:00, sets 18:00
    const p = (t - 6) / 12, e = Math.sin(Math.PI * p);
    const x = W * (.1 + .8 * p), y = hy - e * H * .5;
    const col = mix(hex('#ff7a3a'), hex('#fffbe6'), clamp(e * 1.7, 0, 1));
    glow(x, y, H * .55, col, .45 * P.sun);
    glow(x, y, 70 * u, col, .7 * P.sun);
    ctx.fillStyle = css(mix(col, WHITE, .35), .15 + .85 * P.sun); ctx.beginPath(); ctx.arc(x, y, 24 * u, 0, 6.283); ctx.fill();
  }
  if (t > 17.5 || t < 6.5) {                              // moon takes the night shift
    const p = ((t + 6) % 24) / 12, e = Math.sin(Math.PI * p);
    const x = W * (.1 + .8 * p), y = hy - e * H * .48, r = 19 * u, m = hex('#f3efdc');
    glow(x, y, 150 * u, hex('#9fb4ff'), .28);
    ctx.fillStyle = css(m); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(120,125,150,.28)';
    for (const [cx, cy, cr] of [[-.3, -.25, .26], [.35, .1, .2], [-.1, .45, .16], [.15, -.5, .12]]) {
      ctx.beginPath(); ctx.arc(x + cx * r, y + cy * r, cr * r, 0, 6.283); ctx.fill();
    }
  }

  // clouds: one unioned path per cloud so the blobs don't show overlaps
  ctx.fillStyle = css(mix(mix(P.hor, P.top, .3), WHITE, (.15 + .6 * P.light) * (1 - .45 * P.wet)), Math.min(.95, .25 + .5 * P.light + .3 * P.wet));
  for (const c of clouds) {
    const cx = ((c.x + time * c.sp) % 1.5 + 1.5) % 1.5 * W - .25 * W, cy = c.y * H, k = c.sc * u;
    ctx.beginPath();
    for (const b of c.blobs) { ctx.moveTo(cx + (b.dx + b.r * 1.25) * k, cy + b.dy * k); ctx.ellipse(cx + b.dx * k, cy + b.dy * k, b.r * k * 1.25, b.r * k * .62, 0, 0, 6.283); }
    ctx.fill();
  }

  drawStorm(P, time);
  drawShootingStars();
  if (santa.t >= 0) {
    const st = santa.t, k = u * 1.5;
    santa.x = santa.dir > 0 ? lerp(-170 * k, W + 170 * k, st) : lerp(W + 170 * k, -170 * k, st);
    santa.y = santa.y0 + Math.sin(st * 9) * 16 * u - Math.sin(Math.PI * st) * 24 * u;
    put(santa, null, null, P, time);
  }

  if (P.light > .45) {                                    // birds, drawn as two quick pen flicks
    ctx.strokeStyle = css(P.ink, .7 * smooth(.45, .7, P.light)); ctx.lineCap = 'round';
    for (const b of birds) {
      const x = ((b.x + time * b.sp) % 1.2) * W - .1 * W, y = b.y * H + Math.sin(time * .7 + b.ph) * 8 * u;
      const k = 7 * u * b.sz, flap = Math.sin(time * 6 + b.ph) * .6;
      ctx.lineWidth = 1.6 * u * b.sz;
      ctx.beginPath();
      ctx.moveTo(x - k, y - k * flap); ctx.quadraticCurveTo(x - k * .4, y - k * .5, x, y);
      ctx.quadraticCurveTo(x + k * .4, y - k * .5, x + k, y - k * flap);

    }

}

function bulb(x, y, r, k, time, P, seed) {
  const c = XMAS[k % 5], a = .6 + .4 * Math.sin(time * 2.6 + k * 1.9 + seed * 20);
  ctx.fillStyle = css(c, a); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  if (P.lit > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = css(c, .3 * a * P.lit); ctx.beginPath(); ctx.arc(x, y, r * 2.8, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}
function star5(x, y, r) {
  ctx.beginPath();
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; k ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
// a red aircraft-warning light, blinking after dark
function beacon(x, y, s, P, time, ph) {
  if (P.lit < .2 || Math.sin(time * 2.4 + ph * 9) < 0) return;
  ctx.fillStyle = '#ff4030'; ctx.beginPath(); ctx.arc(x, y, 1.2 * s, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,64,48,.3)';
  ctx.beginPath(); ctx.arc(x, y, 4.5 * s, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

// A building on the street: its long wall runs away toward the vanishing point, its end
// wall stands square to the eye. Shops keep a lit front under a striped awning.
function drawBld(o, shade, ink, P, time) {
  const sd = o.side, XB = sd * cam.B, z1 = o.z1, z2 = o.z2, h = o.h, fl = o.fl, G = o.G, k1 = cam.f / z1;
  const loose = dz.on && o._g === dz.gen && o._ox !== null;   // torn free: only the street end of the block flies
  const xa = px(XB, z1), xb = px(XB, z2), xo = px(XB + sd * (loose ? Math.min(o.w, 12) : o.w), z1);
  const ya0 = py(0, z1), ya1 = py(h, z1), yb0 = py(0, z2), yb1 = py(h, z2);
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.strokeStyle = ink; ctx.lineWidth = clamp(k1 * .09, .7, 2.5 * u);
  if (o.tower) {                                           // mast and warning light
    const zm = (z1 + z2) / 2, mx = px(XB + sd * 4, zm), km = cam.f / zm;
    ctx.beginPath(); ctx.moveTo(mx, py(h, zm)); ctx.lineTo(mx, py(h + 10, zm)); ctx.stroke();
    beacon(mx, py(h + 10, zm), Math.max(1, km * .25), P, time, o.r);
  }
  if (h < cam.h) {                                         // seen from above: the roof shows
    ctx.fillStyle = shade(mix(o.roof, SNOW_OBJ, P.cover * .9));
    ctx.beginPath(); quad(xa, ya1, xb, yb1, px(XB + sd * o.w, z2), yb1, xo, ya1); ctx.fill(); ctx.stroke();
  }

  /* the end wall */
  ctx.fillStyle = shade(mix(o.wall, P.ink, .16));
  ctx.beginPath(); ctx.rect(xa, ya1, xo - xa, ya0 - ya1); ctx.fill(); ctx.stroke();
  let any = false;
  if (o.fy0 < h) {
    const bw = Math.min(o.w, 28) / o.colsF;
    for (const lit of [false, true]) {
      if (lit && P.lit <= 0) break;
      ctx.fillStyle = lit ? css(o.glow) : shade(o.tower ? GLASS : WINDOW);
      ctx.beginPath();
      for (let r = 0; r < o.rows; r++) {
        const Yb = G + r * fl + fl * .2;
        if (Yb < o.fy0) continue;
        for (let c = 0; c < o.colsF; c++) {
          if (lit && !(P.lit > o.litF[r * o.colsF + c])) continue;
          if (lit) any = true;
          ctx.rect(px(XB + sd * (c + .22) * bw, z1), py(Yb + fl * .58, z1), sd * k1 * bw * .56, k1 * fl * .58);
        }
      }

    }

  ctx.fillStyle = shade(o.wall);
  ctx.beginPath(); quad(xa, ya0, xa, ya1, xb, yb1, xb, yb0); ctx.fill(); ctx.stroke();
  const bl = (z2 - z1) / o.cols;
  const pane = (za, zb, Yb, Yt) => quad(px(XB, za), py(Yt, za), px(XB, zb), py(Yt, zb), px(XB, zb), py(Yb, zb), px(XB, za), py(Yb, za));
  const seen = (za, zb) => { const x1 = px(XB, za), x2 = px(XB, zb); return Math.max(x1, x2) > 0 && Math.min(x1, x2) < W; };
  for (const lit of [false, true]) {
    if (lit && P.lit <= 0) break;
    ctx.fillStyle = lit ? css(o.glow) : shade(o.tower ? GLASS : WINDOW);
    ctx.beginPath();
    for (let c = 0; c < o.cols; c++) {
      const za = z1 + (c + .22) * bl, zb = z1 + (c + .78) * bl;
      if (!seen(za, zb)) continue;
      for (let r = 0; r < o.rows; r++) {
        const Yb = G + r * fl + fl * .2;
        if (py(Yb, zb) < 0) break;                         // this floor and all above it are off the top of the screen
        if (lit && !(P.lit > o.lit[r * o.cols + c])) continue;
        if (lit) any = true;
        pane(za, zb, Yb, Yb + fl * .58);
      }
    }
    ctx.fill();
  }

  /* ground floor */
  const open = o.shop && P.lit > o.lit[0] * .4, zd = z1 + (o.doorC + .5) * bl;
  any = any || open;
  ctx.fillStyle = open ? css(WARM) : shade(WINDOW);
  ctx.beginPath();
  for (let c = 0; c < o.cols; c++) {
    if (c === o.doorC) continue;
    const za = z1 + (c + (o.shop ? .1 : .25)) * bl, zb = z1 + (c + (o.shop ? .9 : .75)) * bl;
    if (seen(za, zb)) o.shop ? pane(za, zb, .7, 3) : pane(za, zb, 1.2, 2.9);
  }
  ctx.fill();
  ctx.fillStyle = shade(WOOD);
  ctx.beginPath(); pane(zd - .65, zd + .65, 0, 2.5); ctx.fill();
  if (o.shop) for (const odd of [0, 1]) {                  // the awning, stripe by stripe
    ctx.fillStyle = shade(mix(odd ? WHITEWASH : o.awn, SNOW_OBJ, P.cover * .7));
    ctx.beginPath();
    for (let k = odd; k < o.cols * 2; k += 2) { const za = z1 + k * bl / 2, zb = za + bl / 2; if (seen(za, zb)) pane(za, zb, 3.2, 3.9); }
    ctx.fill();
  }
  if (P.cover > .1) {                                      // snow along the roof edge
    ctx.globalAlpha = P.cover; ctx.strokeStyle = shade(SNOW_OBJ); ctx.lineWidth = clamp(k1 * .45, 1, 7 * u);
    ctx.beginPath(); ctx.moveTo(xo, ya1); ctx.lineTo(xa, ya1); ctx.lineTo(xb, yb1); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  if (xmasOn) {                                            // a string of bulbs above the shop fronts, a wreath over the door
    let n = 0;
    for (let z = z1 + .4; z < z2; z += Math.max(1.4, z / 22), n++) {
      const x = px(XB, z);
      if (x < -10 || x > W + 10) continue;
      bulb(x, py(4.05 + (n % 2) * .16, z), clamp(cam.f / z * .075, .9, 4 * u), n + ((o.r * 5) | 0), time, P, o.r);
    }
    const kd = cam.f / zd, wx = px(XB, zd), wy = py(2.95, zd);
    if (wx > 0 && wx < W) {

      ctx.fillStyle = css(XMAS[0]); ctx.beginPath(); ctx.arc(wx, wy + kd * .32, Math.max(.8, kd * .09), 0, 6.283); ctx.fill();
    }

}

function drawLamp(o, L, ink, P) {
  const s = L.s, top = o.y - o.h * s;
  ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.7, .9 * s); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x, top); ctx.stroke();
  ctx.fillStyle = P.lit > .15 ? css(WARM) : ink;
  ctx.fillRect(o.x - 1.6 * s, top - 3.2 * s, 3.2 * s, 3.4 * s);
  if (P.lit > .15) lampGlow(o.x, top - s, 24 * s, .75 * P.lit);
}

// A Christmas garland: bulbs strung across the street from lamp post to lamp post, a gold star at the middle.
function drawGarland(g, ink, P, time) {
  const s = g.a.L.s, x1 = g.a.x, y1 = g.a.y - 37 * s, x2 = g.b.x, y2 = g.b.y - 37 * s, len = Math.hypot(x2 - x1, y2 - y1);
  const n = clamp(Math.floor(len / (5 * s)), 3, 22), mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + len * .1 + Math.sin(time * 1.3 + g.r * 9) * 1.2 * s;
  ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.5, .5 * s);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx, my, x2, y2); ctx.stroke();
  for (let k = 1; k < n; k++) {
    const t = k / n, m = 1 - t;
    bulb(m * m * x1 + 2 * m * t * mx + t * t * x2, m * m * y1 + 2 * m * t * my + t * t * y2 + s, Math.max(.9, .8 * s), k, time, P, g.r);
  }
  const sy = (y1 + y2) / 4 + my / 2 + 5 * s;
  ctx.fillStyle = css(GOLD); star5(mx, sy, Math.max(1.5, 4.5 * s));
  if (P.lit > 0) lampGlow(mx, sy, 14 * s, .6 * P.lit);
}

function drawSnowman(o, L, shade, ink, P) {
  if (P.cover < .25) return;
  const s = L.s, x = o.x, y = o.y;
  ctx.globalAlpha = smooth(.25, .7, P.cover);
  ctx.fillStyle = shade(SNOW_OBJ); ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.5, .7 * s);
  for (const [dy, r] of [[3.2, 3.4], [7.8, 2.6], [11.4, 1.9]]) { ctx.beginPath(); ctx.arc(x, y - dy * s, r * s, 0, 6.283); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = ink; ctx.fillRect(x - 1.7 * s, y - 15.6 * s, 3.4 * s, 2.6 * s); ctx.fillRect(x - 2.6 * s, y - 13.2 * s, 5.2 * s, .8 * s);
  ctx.strokeStyle = css(XMAS[0]); ctx.lineWidth = Math.max(.8, 1.1 * s);
  ctx.beginPath(); ctx.moveTo(x - 1.8 * s, y - 9.8 * s); ctx.lineTo(x + 1.8 * s, y - 9.8 * s); ctx.lineTo(x + 2.6 * s, y - 7 * s); ctx.stroke();
  ctx.fillStyle = '#f08020'; ctx.beginPath(); ctx.arc(x + (o.r < .5 ? -1 : 1) * 1.6 * s, y - 11.2 * s, .7 * s, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
}

// pine: stacked triangles · cedar: tall, with drooping tiers · aspen: pale slim
// trunk under a narrow crown · round: broadleaf. Leaves follow the season.
function drawTree(o, L, shade, ink, P, time) {
  const s = L.s, x = o.x, y = o.y, h = o.h * s, lean = (o.r - .5) * 2 * s, cov = P.cover;
  ctx.lineCap = ctx.lineJoin = 'round';
  if (o.kind === 'pine' || o.kind === 'cedar') {
    const cedar = o.kind === 'cedar', n = cedar ? 5 : 3, w = h * (cedar ? .34 : .42);
    const step = h * .86 / n, th = step * 1.55;
    ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1, 2 * s);
    ctx.beginPath(); ctx.moveTo(x, y + 2 * s); ctx.lineTo(x, y - h * .3); ctx.stroke();
    ctx.fillStyle = shade(mix((cedar ? CEDARS : PINES)[(o.v * 4) | 0], SNOW_OBJ, cov * .3));
    ctx.beginPath();
    for (let k = 0; k < n; k++) {
      const by = y - h * .12 - k * step, ty = by - th, hw = w / 2 * (1 - k / n * .8);
      if (cedar) {
        ctx.moveTo(x + lean, ty); ctx.quadraticCurveTo(x - hw * .25, by - th * .3, x - hw, by + th * .12);
        ctx.lineTo(x, by - th * .18); ctx.lineTo(x + hw, by + th * .12); ctx.quadraticCurveTo(x + hw * .25, by - th * .3, x + lean, ty);
      } else { ctx.moveTo(x - hw, by); ctx.lineTo(x + lean, ty); ctx.lineTo(x + hw, by); ctx.closePath(); }
    }
    ctx.fill();
    if (cov > .1) {                                            // snow lying on each tier
      ctx.globalAlpha = cov; ctx.fillStyle = shade(SNOW_OBJ);
      ctx.beginPath();
      for (let k = 0; k < n; k++) {
        const by = y - h * .12 - k * step, ty = by - th, hw = w / 2 * (1 - k / n * .8);
        ctx.moveTo(x - hw * .5, by - th * .42); ctx.lineTo(x + lean, ty); ctx.lineTo(x + hw * .5, by - th * .42); ctx.quadraticCurveTo(x, by - th * .62, x - hw * .5, by - th * .42);
      }
      ctx.fill(); ctx.globalAlpha = 1;
    }
    ctx.lineWidth = Math.max(.8, 1.2 * s);                     // one inked edge, on the shaded side
    ctx.beginPath(); ctx.moveTo(x + lean, y - h * .12 - (n - 1) * step - th); ctx.lineTo(x + w / 2, y - h * .12); ctx.stroke();
    if (xmasOn && o.xmas) {
      const r = Math.max(.9, s), nb = o.h > 55 ? 26 : 10, big = o.h > 55;
      for (let k = 0; k < nb; k++) { const t = k / (nb - 1); bulb(x + Math.sin(k * 2.2 + o.r * 6) * w * .42 * (1 - t), y - h * (.18 + .92 * t), r, k, time, P, o.r); }
      ctx.fillStyle = css(GOLD);
      if (big) star5(x + lean, y - h * 1.15, 4.2 * s); else { ctx.beginPath(); ctx.arc(x + lean, y - h * 1.13, 1.7 * s, 0, 6.283); ctx.fill(); }
      if (P.lit > 0) lampGlow(x + lean, y - h * 1.13, (big ? 18 : 9) * s, .7 * P.lit);
    }
    return;
  }

  const aspen = o.kind === 'aspen', leaves = LEAF[o.kind][P.season];
  const tx = x + lean * 1.5, ty = y - h * (aspen ? .8 : .45);
  if (aspen) {
    ctx.strokeStyle = shade(ASPEN_BARK); ctx.lineWidth = Math.max(1, 1.8 * s);
    ctx.beginPath(); ctx.moveTo(x, y + 2 * s); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.6, .8 * s);
    ctx.beginPath();
    for (const t of [.15, .3, .42]) { const px = lerp(x, tx, t / .8), py = y - h * t; ctx.moveTo(px - .9 * s, py); ctx.lineTo(px + .5 * s, py); }
    ctx.stroke();
  } else {
    ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1, 2.2 * s);
    ctx.beginPath(); ctx.moveTo(x, y + 2 * s); ctx.lineTo(tx, ty); ctx.stroke();
  }
  if (!leaves) {                                               // winter: bare branches
    ctx.strokeStyle = aspen ? shade(ASPEN_BARK) : ink; ctx.lineWidth = Math.max(.6, .9 * s);
    ctx.beginPath();
    const spread = h * (aspen ? .13 : .26);
    for (let k = 0; k < 6; k++) {
      const t = aspen ? .4 + k * .08 : .25 + k * .04, sd = k % 2 ? 1 : -1;
      const bx = lerp(x, tx, Math.min(1, t / (aspen ? .8 : .45))), by = y - h * Math.min(t, aspen ? .8 : .45);
      ctx.moveTo(bx, by); ctx.lineTo(bx + sd * spread * (1 - k * .08), by - h * (aspen ? .16 : .3));
    }
    ctx.moveTo(tx, ty); ctx.lineTo(tx + lean, ty - h * .2);
    ctx.stroke();
    return;
  }
  ctx.fillStyle = shade(mix(leaves[(o.v * leaves.length) | 0], SNOW_OBJ, cov * .45));
  ctx.beginPath();
  if (aspen) {
    const r = h * .15;
    for (const [dx, t, k] of [[0, .5, .9], [-.6, .62, .75], [.6, .68, .75], [-.25, .8, .8], [.3, .9, .65], [0, 1, .5]]) {
      ctx.moveTo(tx + dx * r + r * k, y - h * t); ctx.arc(tx + dx * r, y - h * t, r * k, 0, 6.283);
    }
    ctx.fill();
  } else {
    const r = h * .3, cy = y - h * .68;
    for (const [dx, dy, k] of [[0, 0, 1], [-.75, .3, .72], [.75, .28, .76], [.1, -.6, .7]]) {
      ctx.moveTo(x + dx * r + r * k, cy + dy * r); ctx.arc(x + dx * r, cy + dy * r, r * k, 0, 6.283);
    }
    ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.8, 1.5 * s);
    ctx.beginPath(); ctx.arc(x, cy, r * 1.15, .15, 1.45); ctx.stroke();
  }
}

function drawPerson(p, L, shade, ink, P, time) {
  const s = L.s * p.size * .58, x = p.x, h = 20 * s;
  const running = p.runner ? P.wet : 0, brolly = p.runner ? 0 : smooth(.2, .5, P.wet);
  const ph = p.ph / (1 + .8 * running), sw = p.moving ? Math.sin(ph) * (1 + .5 * running) : 0;
  const y = p.y - (p.moving ? Math.abs(Math.cos(ph)) * .9 * s : 0);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.9, 1.8 * s);
  ctx.beginPath();
  ctx.moveTo(x, y - h * .42); ctx.lineTo(x + sw * 3.4 * s, y);
  ctx.moveTo(x, y - h * .42); ctx.lineTo(x - sw * 3.4 * s - (p.moving ? 0 : 1.2 * s), y);
  ctx.stroke();
  ctx.fillStyle = shade(p.col);
  ctx.beginPath();
  ctx.moveTo(x - 2.4 * s, y - h * .8); ctx.lineTo(x + 2.4 * s, y - h * .8);
  ctx.lineTo(x + 4.2 * s, y - h * .34); ctx.lineTo(x - 4.2 * s, y - h * .34); ctx.closePath();
  ctx.fill();
  const hx = x + p.dir * (3.2 - sw * 2) * s, hy = y - h * .46;
  ctx.lineWidth = Math.max(.7, 1.4 * s);
  ctx.beginPath(); ctx.moveTo(x, y - h * .74); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = shade(SKIN);
  ctx.beginPath(); ctx.arc(x, y - h * .9, 2.7 * s, 0, 6.283); ctx.fill();
  ctx.fillStyle = shade(HAIR);
  ctx.beginPath(); ctx.arc(x - p.dir * .5 * s, y - h * .92, 2.8 * s, Math.PI * .95, Math.PI * 2.05); ctx.fill();
  if (brolly > 0) {                                        // umbrella up
    const ux = x + p.dir * 1.2 * s, uy = y - h * 1.22;
    ctx.globalAlpha = brolly;
    ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.6, .9 * s);
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ux, uy); ctx.stroke();
    ctx.fillStyle = shade(p.brolly);
    ctx.beginPath(); ctx.arc(ux, uy, 7 * s, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  }

    ctx.fillStyle = css(WARM); ctx.beginPath(); ctx.arc(hx, hy + 2 * s, 1.5 * s, 0, 6.283); ctx.fill();
    lampGlow(hx, hy + 2 * s, 16 * s, .7 * smooth(.42, .25, P.light));
  }

}

// The dog trots a little behind its owner, and stands wagging when they stop.
function drawDog(p, s, y, shade, ink, time) {
  const d = p.dir, bx = p.x - d * 8 * s, sw = p.moving ? Math.sin(p.ph * 1.5) : 0;
  ctx.lineCap = 'round';
  ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.7, 1.1 * s);
  ctx.beginPath();
  for (const [o, sg] of [[-2.2, 1], [-1.4, -1], [1.5, -1], [2.3, 1]]) { ctx.moveTo(bx + d * o * s, y - 2.6 * s); ctx.lineTo(bx + d * o * s + sg * sw * 1.4 * s, y); }
  ctx.stroke();
  const col = shade(p.dog);
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(.8, 1.3 * s);
  ctx.beginPath(); ctx.moveTo(bx - d * 3 * s, y - 4 * s); ctx.lineTo(bx - d * (4.6 + Math.sin(time * 9 + p.size * 40) * .9) * s, y - 6.6 * s); ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(bx, y - 3.5 * s, 3.5 * s, 1.8 * s, 0, 0, 6.283);
  ctx.moveTo(bx + d * 5.7 * s, y - 5.2 * s); ctx.arc(bx + d * 4 * s, y - 5.2 * s, 1.7 * s, 0, 6.283);
  ctx.moveTo(bx + d * 6.3 * s, y - 4.7 * s); ctx.arc(bx + d * 5.4 * s, y - 4.7 * s, .9 * s, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.arc(bx + d * 3.3 * s, y - 6.2 * s, .9 * s, 0, 6.283); ctx.fill();
}

// A box standing on the road, seen from above and behind or ahead: the flank facing the
// middle of the street, the top, then the end nearest the eye.
function box(X0, X1, Y0, Y1, Z0, Z1, top, end, side, edged) {
  const Xi = X0 + X1 > 0 ? X0 : X1;
  ctx.fillStyle = side; ctx.beginPath(); quad(px(Xi, Z0), py(Y0, Z0), px(Xi, Z0), py(Y1, Z0), px(Xi, Z1), py(Y1, Z1), px(Xi, Z1), py(Y0, Z1)); ctx.fill(); if (edged) ctx.stroke();
  ctx.fillStyle = top; ctx.beginPath(); quad(px(X0, Z0), py(Y1, Z0), px(X1, Z0), py(Y1, Z0), px(X1, Z1), py(Y1, Z1), px(X0, Z1), py(Y1, Z1)); ctx.fill(); if (edged) ctx.stroke();
  ctx.fillStyle = end; ctx.beginPath(); ctx.rect(px(X0, Z0), py(Y1, Z0), px(X1, Z0) - px(X0, Z0), py(Y0, Z0) - py(Y1, Z0)); ctx.fill(); if (edged) ctx.stroke();
}

// A car or a bus in its lane: headlights if it is coming toward the eye, tail lights if it is
// driving away; snow on the roof, and in December some carry a tree home.
function drawCar(c, shade, ink, P) {
  const X = c.X, hw = c.wd / 2, Z0 = c.Z - c.len / 2, Z1 = c.Z + c.len / 2, toward = c.vz < 0;
  if (Z0 < cam.z0 * .12) return;
  const k = cam.f / Z0, Xi = X > 0 ? X - hw : X + hw, body = c.col, dim = shade(mix(body, HAIR, .28));
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.strokeStyle = ink; ctx.lineWidth = clamp(k * .05, .6, 2 * u);
  const tyre = shade(HAIR);
  box(X - hw, X + hw, 0, .42, Z0 + .25, Z1 - .25, tyre, tyre, tyre);                    // wheels and the shadow beneath
  const glass = c.bus && P.lit > .3 ? css(WARM) : shade(GLASS);
  if (c.bus) {
    box(X - hw, X + hw, .42, c.ht, Z0, Z1, shade(mix(body, SNOW_OBJ, P.cover * .85)), shade(body), dim, true);
    ctx.fillStyle = glass;
    ctx.fillRect(px(X - hw + .2, Z0), py(c.ht - .35, Z0), k * (c.wd - .4), k * 1.25);
    ctx.beginPath(); quad(px(Xi, Z0 + .5), py(2.7, Z0 + .5), px(Xi, Z1 - .5), py(2.7, Z1 - .5), px(Xi, Z1 - .5), py(1.5, Z1 - .5), px(Xi, Z0 + .5), py(1.5, Z0 + .5)); ctx.fill();
  } else {
    const a = toward ? 1.3 : .7, b = toward ? .7 : 1.3, c0 = Z0 + a, c1 = Z1 - b, in0 = X - hw + .14, in1 = X + hw - .14, ci = X > 0 ? in0 : in1;
    box(X - hw, X + hw, .42, .95, Z0, Z1, shade(mix(body, WHITE, .12)), shade(body), dim, true);
    box(in0, in1, .95, c.ht, c0, c1, shade(mix(mix(body, WHITE, .12), SNOW_OBJ, P.cover * .85)), shade(body), dim, true);
    const kc = cam.f / c0;
    ctx.fillStyle = glass;
    ctx.fillRect(px(in0 + .1, c0), py(c.ht - .08, c0), kc * (c.wd - .48), kc * (c.ht - 1.08));
    ctx.beginPath(); quad(px(ci, c0 + .15), py(c.ht - .08, c0 + .15), px(ci, c1 - .15), py(c.ht - .08, c1 - .15), px(ci, c1 - .15), py(1, c1 - .15), px(ci, c0 + .15), py(1, c0 + .15)); ctx.fill();
    if (c.tree && xmasOn) { const g = shade(PINES[1]); box(X - .28, X + .28, c.ht, c.ht + .4, c0 + .1, c1 + .5, g, g, shade(PINES[0])); }
  }
  const ly = py(.72, Z0), r = Math.max(.8, k * .13);
  for (const lx of [px(X - hw + .3, Z0), px(X + hw - .3, Z0)]) {
    if (toward) {
      ctx.fillStyle = P.lit > .15 ? css(WARM) : shade(WHITEWASH); ctx.beginPath(); ctx.arc(lx, ly, r, 0, 6.283); ctx.fill();
      if (P.lit > .15) lampGlow(lx, ly, k * 1.3, .7 * P.lit);
    } else {
      ctx.fillStyle = '#ff3b30'; ctx.fillRect(lx - r * 1.3, ly - r * .7, r * 2.6, r * 1.4);
      if (P.lit > .15) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,50,40,${.3 * P.lit})`; ctx.beginPath(); ctx.arc(lx, ly, r * 3.2, 0, 6.283); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
    }
  }
  if (!toward && P.lit > .15) lampGlow(px(X, Z1 + 3), py(.3, Z1 + 3), cam.f / Z1 * 2.2, .45 * P.lit);   // its headlights on the road ahead
}

/* ---------- fireworks ---------- */
function launch() {
  const x = cam.cx + (Math.random() - .5) * H * .5, y = cam.hy;
  const ty = H * lerp(.05, .26, Math.random()), T = lerp(1, 1.5, Math.random());
  fw.rockets.push({ x, y, vx: (Math.random() - .5) * 50 * u, vy: -2 * (y - ty) / T, a: 2 * (y - ty) / (T * T), t: 0, T, hue: Math.random() * 360 });
}
function explode(r) {

  const n = type === 1 ? 46 : 95, v = u * lerp(120, 220, Math.random());
  const hue2 = (r.hue + lerp(50, 180, Math.random())) % 360, tilt = Math.random() * Math.PI, ct = Math.cos(tilt), st = Math.sin(tilt);
  for (let k = 0; k < n; k++) {

    if (type === 1) { const ex = vx, ey = vy * .4; vx = ex * ct - ey * st; vy = ex * st + ey * ct; }
    const max = type === 2 ? lerp(2, 2.9, Math.random()) : lerp(1.2, 1.9, Math.random());
    fw.sparks.push({
      x: r.x, y: r.y, vx, vy, life: max, max, g: (type === 2 ? 95 : 55) * u, trail: type === 2 ? .16 : .06,
      hue: type === 2 ? lerp(36, 48, Math.random()) : type === 3 && k % 2 ? hue2 : r.hue,
    });

}
function stepFireworks(dt, night) {
  if (fireworksOn && night > .6 && !(dz.on && dz.t > 2)) {
    fw.next -= dt;
    if (fw.next <= 0) { launch(); if (Math.random() < .3) launch(); fw.next = lerp(.25, 1.4, Math.random()); }
  }
  for (const r of fw.rockets) { r.t += dt; r.x += r.vx * dt; r.y += r.vy * dt; r.vy += r.a * dt; if (r.t >= r.T) explode(r); }
