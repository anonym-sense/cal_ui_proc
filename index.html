  for (const p of fw.sparks) { p.vx *= f; p.vy = p.vy * f + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  fw.sparks = fw.sparks.filter(p => p.life > 0);
  for (const b of fw.flashes) b.life -= dt;
  fw.flashes = fw.flashes.filter(b => b.life > 0);
}
function drawFireworks() {
  if (!fw.rockets.length && !fw.sparks.length && !fw.flashes.length) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const b of fw.flashes) {
    const a = b.life / .35, r = 170 * u, g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
    g.addColorStop(0, `hsla(${b.hue},100%,80%,${.5 * a})`); g.addColorStop(1, `hsla(${b.hue},100%,60%,0)`);
    ctx.fillStyle = g; ctx.fillRect(b.x - r, b.y - r, r * 2, r * 2);
  }
  ctx.lineWidth = 1.6 * u; ctx.strokeStyle = 'rgba(255,225,170,.85)';
  for (const r of fw.rockets) { ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.vx * .05, r.y - r.vy * .05); ctx.stroke(); }
  ctx.lineWidth = 1.8 * u;
  for (const p of fw.sparks) {
    const k = p.life / p.max;
    if (k < .3 && Math.random() < .35) continue;        // crackle as they die
    ctx.strokeStyle = `hsla(${p.hue},100%,${60 + 25 * k}%,${Math.min(1, k * 1.7)})`;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * p.trail, p.y - p.vy * p.trail); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------- season + weather ---------- */
const lum = c => .3 * c[0] + .59 * c[1] + .11 * c[2];
function applySeason(P) {
  const S = SEASON[P.season = season()];
  if (S) for (const f of ['midc', 'near']) {               // swap the hue, keep the hour's brightness
    const c = P[f], k = lum(c) / lum(S[f]);
    P[f] = mix(c, S[f].map(v => Math.min(255, v * k)), S.k * (.4 + .6 * P.light));
  }
  P.snow = mix(mix(P.far, WHITE, .3 + .62 * P.light), P.haze, .1);
  P.cover = cover; P.wet = wet;
  P.stars *= 1 - .9 * Math.max(wet, fall * .6);            // cloud hides the stars
  P.sun = 1 - Math.max(.85 * wet, .5 * fall);              // the sun behind cloud
  P.grey = mix(P.haze, [150, 158, 174].map(v => v * (.25 + .75 * P.light)), .65);
  const overcast = Math.max(fall * .45, wet * .7);         // snow and rain clouds grey the sky
  if (overcast > 0) for (const f of ['top', 'mid', 'hor']) P[f] = mix(P[f], P.grey, overcast);
}
function stepWeather(dt, time) {
  const ease = (v, target, up, down) => v + clamp(target - v, -dt / down, dt / up);
  wet = ease(wet, rainOn ? 1 : 0, 2.5, 4);
  if (wet > 0) for (const r of drops) {
    r.y += r.v * dt; r.x -= r.v * .18 * dt;
    if (r.y > H) { r.y = -r.len; r.x = Math.random() * W * 1.2; }
  }
  const target = snowOn ? 1 : 0;
  fall += clamp(target - fall, -dt / 2.5, dt / 2.5);
  cover += clamp(target - cover, -dt / 10, dt / 6);        // settles in seconds, melts a little slower
  if (fall <= 0) return;
  for (const f of flakes) {
    f.y += f.v * dt; f.x += (Math.sin(time * .8 + f.ph) * 14 + 12) * u * dt;
    if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
    if (f.x > W + 4) f.x = -4;
  }
}
function drawSnow(P) {
  if (fall <= 0) return;
  ctx.fillStyle = css(WHITE, .5 + .4 * P.light);
  ctx.beginPath();
  const n = Math.floor(flakes.length * fall);
  for (let k = 0; k < n; k++) { const f = flakes[k]; ctx.moveTo(f.x + f.r, f.y); ctx.arc(f.x, f.y, f.r, 0, 6.283); }
  ctx.fill();
}
function drawRain(P) {
  if (wet <= 0) return;
  ctx.strokeStyle = css(mix(P.grey, WHITE, .55), .2 + .22 * P.light); ctx.lineWidth = Math.max(.8, 1.1 * u); ctx.lineCap = 'round';
  ctx.beginPath();
  const n = Math.floor(drops.length * wet);
  for (let k = 0; k < n; k++) { const r = drops[k]; ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - r.len * .18, r.y + r.len); }
  ctx.stroke();
}

/* ---------- sky visitors: storm cloud, shooting stars, Santa ---------- */
const shoot = { list: [], next: 2 }, santa = { type: 'santa', t: -1, next: 5, dir: 1, y0: 0, x: 0, y: 0 };

function stepSky(dt, P) {
  // shooting stars: clear summer nights with the fireworks switched off
  if (P.season === 'summer' && P.night > .6 && wet < .05 && fall < .05 && !fireworksOn) {
    shoot.next -= dt;
    if (shoot.next <= 0) {
      const d = Math.random() < .5 ? -1 : 1, v = lerp(520, 820, Math.random()) * u;
      shoot.list.push({ x: W * lerp(.1, .9, Math.random()), y: H * lerp(.02, .3, Math.random()), vx: d * v, vy: v * lerp(.25, .5, Math.random()), life: 0, max: lerp(.8, 1.3, Math.random()) });
      shoot.next = lerp(1.5, 7, Math.random());
    }
  }
  for (const s of shoot.list) { s.x += s.vx * dt; s.y += s.vy * dt; s.life += dt; }
  shoot.list = shoot.list.filter(s => s.life < s.max);

  // Santa: a snowy night with the Christmas lights on
  if (santa.t >= 0) { santa.t += dt / 17; if (santa.t > 1) { santa.t = -1; santa.next = lerp(10, 26, Math.random()); } }
  else if (snowOn && xmasOn && P.night > .6 && !dz.on) {
    santa.next -= dt;
    if (santa.next <= 0) { santa.t = 0; santa.dir = Math.random() < .5 ? -1 : 1; santa.y0 = H * lerp(.08, .18, Math.random()); }
  }
}

function drawStorm(P, time) {
  const oc = Math.max(P.wet, fall * .6);
  if (oc <= 0) return;
  ctx.fillStyle = css(mix(P.grey, P.ink, .25), .78 * oc);
  for (const c of storm) {
    const cx = ((c.x + time * c.sp) % 1.6 + 1.6) % 1.6 * W - .3 * W, cy = c.y * H, k = c.sc * u;
    ctx.beginPath();
    for (const b of c.blobs) { ctx.moveTo(cx + (b.dx + b.r * 1.25) * k, cy + b.dy * k); ctx.ellipse(cx + b.dx * k, cy + b.dy * k, b.r * k * 1.25, b.r * k * .62, 0, 0, 6.283); }
    ctx.fill();
  }
}

function drawShootingStars() {
  if (!shoot.list.length) return;
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineWidth = 2.2 * u;
  for (const s of shoot.list) {
    const a = Math.sin(Math.PI * s.life / s.max), tail = .2;
    const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * tail, s.y - s.vy * tail);
    g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(160,190,255,0)');
    ctx.strokeStyle = g;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * tail, s.y - s.vy * tail); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, 1.5 * u, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// Four reindeer, a red sleigh and a trail of gold dust, drawn facing +x and mirrored for direction.
function drawSanta(o, time) {
  const t = o.t, k = u * 1.5;
  ctx.save();
  ctx.translate(o.x, o.y); ctx.rotate(o.dir * (Math.cos(t * 9) * .08 - Math.cos(Math.PI * t) * .06)); ctx.scale(o.dir * k, k);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';                  // gold dust
  for (let j = 0; j < 16; j++) {
    const tw = .5 + .5 * Math.sin(time * 7 + j * 2.1);
    ctx.fillStyle = `rgba(255,214,110,${(1 - j / 16) * .8 * tw})`;
    ctx.beginPath(); ctx.arc(-20 - j * 8, 3 + Math.sin(j * 1.7 + time * 2.5) * 4, 1.6 - j * .05, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = .7;           // reins
  ctx.beginPath(); ctx.moveTo(4, -8); ctx.lineTo(26, -5); ctx.lineTo(82, -5); ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const rx = 28 + i * 17, ry = -4 + Math.sin(time * 8 + i * 1.3) * 1.6, g = Math.sin(time * 11 + i * 1.3);
    ctx.strokeStyle = '#4a2f1c'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(rx - 4, ry + 2); ctx.lineTo(rx - 5 - g * 3, ry + 8); ctx.moveTo(rx - 2.5, ry + 2); ctx.lineTo(rx - 2 + g * 3, ry + 8);
    ctx.moveTo(rx + 3, ry + 2); ctx.lineTo(rx + 3 + g * 3, ry + 8); ctx.moveTo(rx + 4.5, ry + 2); ctx.lineTo(rx + 6 - g * 3, ry + 8);
    ctx.moveTo(rx + 7.5, ry - 6); ctx.lineTo(rx + 6.5, ry - 10); ctx.lineTo(rx + 5, ry - 11); ctx.moveTo(rx + 6.5, ry - 10); ctx.lineTo(rx + 8.5, ry - 11.5);   // antlers
    ctx.stroke();
    ctx.fillStyle = '#8a5a34';
    ctx.beginPath(); ctx.ellipse(rx, ry, 6, 2.8, 0, 0, 6.283); ctx.moveTo(rx + 10, ry - 4.5); ctx.arc(rx + 7.6, ry - 4.5, 2.3, 0, 6.283); ctx.fill();
    if (i === 3) { ctx.fillStyle = '#ff4030'; ctx.beginPath(); ctx.arc(rx + 10, ry - 4.3, 1.1, 0, 6.283); ctx.fill(); }
  }
  ctx.fillStyle = '#6b4a2a'; ctx.beginPath(); ctx.arc(-9, -9, 5.5, 0, 6.283); ctx.fill();            // sack
  ctx.fillStyle = '#c62828';                                                                         // sleigh
  ctx.beginPath(); ctx.moveTo(-15, -8); ctx.lineTo(-15, 2); ctx.lineTo(9, 2); ctx.quadraticCurveTo(15, 1, 14, -8); ctx.lineTo(10, -8); ctx.lineTo(8, -3); ctx.lineTo(-10, -3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#eab92d'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(-17, 5); ctx.lineTo(10, 5); ctx.quadraticCurveTo(16, 5, 16, 0); ctx.moveTo(-9, 2); ctx.lineTo(-9, 5); ctx.moveTo(5, 2); ctx.lineTo(5, 5); ctx.stroke();
  ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(0, -7.5, 4.6, 0, 6.283); ctx.fill();           // Santa
  ctx.fillStyle = '#f1c9a5'; ctx.beginPath(); ctx.arc(1.5, -13.5, 2.5, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(2.6, -12, 1.9, 0, 6.283); ctx.arc(-3.6, -17.4, 1.2, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.moveTo(-1, -14.5); ctx.lineTo(3.8, -15.2); ctx.lineTo(-3.4, -17.6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- the scene ---------- */
function drawObj(o, shade, ink, P, time) {
  const L = o.L;
  switch (o.type) {
    case 'bld': return drawBld(o, shade, ink, P, time);
    case 'person': return drawPerson(o, L, shade, ink, P, time);
    case 'car': return drawCar(o, shade, ink, P);
    case 'lamp': return drawLamp(o, L, ink, P);
    case 'garland': return xmasOn ? drawGarland(o, ink, P, time) : undefined;
    case 'snowman': return drawSnowman(o, L, shade, ink, P);
    case 'santa': return drawSanta(o, time);
    default: drawTree(o, L, shade, ink, P, time);
  }
}
// Draw a thing in its place, or, once the hole has hold of it, hand it over to be drawn in flight.
function put(o, shade, ink, P, time) {
  if (dz.on) {
    const s = suck(o, o.x, o.y);
    if (s === GONE) return;
    if (s) { flying.push([s, o, shade, ink]); return; }
  }
  drawObj(o, shade, ink, P, time);
}

function draw(t, time, P) {
  drawSky(P, t, time);
  const dark = mix(P.near, P.ink, .4), night = (1 - P.light) * .74;
  const ground = (L, col) => {
    col = col.map((v, k) => clamp(v + L.tint[k] * (.3 + .7 * P.light), 0, 255));
    if (P.cover > 0) col = mix(col, mix(P.snow, P.near, .14 * L.d), P.cover * lerp(.92, .72, L.d));   // snowed under
    if (P.wet > 0) col = mix(col, P.grey, .22 * P.wet);                                               // rain-dulled
    return col;
  };

  for (const L of mounts) {
    const col = ground(L, mix(P.far, P.midc, L.d * .45));
    const g = ctx.createLinearGradient(0, L.top, 0, L.base + L.amp * .6);
    g.addColorStop(0, css(mix(col, P.haze, .06)));
    g.addColorStop(1, css(mix(col, P.haze, .7 - .2 * L.d)));         // mist pools in the valleys
    ctx.fillStyle = g; ctx.fill(L.fill);
    if (L.cap) { ctx.fillStyle = css(P.snow, .94); ctx.fill(L.cap); }
    const inkC = mix(col, P.ink, .74), ink = css(inkC, .9);
    ctx.fillStyle = css(inkC, .34); ctx.fill(L.echo[0]);
    ctx.fillStyle = css(mix(col, P.haze, .7), .3); ctx.fill(L.echo[1]);
    ctx.fillStyle = css(inkC, .92); ctx.fill(L.ridge);
    ctx.strokeStyle = css(inkC, .6); ctx.lineWidth = Math.max(.8, 1.2 * u * (.5 + L.d * .5)); ctx.lineJoin = 'round';
    ctx.stroke(L.hair);
    const shade = c => css(mix(mix(c, col, .5), dark, night));
    for (const o of L.objs) drawTree(o, L, shade, ink, P, time);
  }
  const hz = ctx.createLinearGradient(0, cam.hy - H * .13, 0, cam.hy);     // haze where the range meets the plain
  hz.addColorStop(0, css(P.haze, 0)); hz.addColorStop(1, css(P.haze, .55));
  ctx.fillStyle = hz; ctx.fillRect(0, cam.hy - H * .13, W, H * .13 + 1);
  drawFireworks();                                         // rockets rise from the far end of the street

  /* the ground plane: open country, the two pavements, the road, all running to the vanishing point */
  const col = ground({ tint: cam.tint, d: .8 }, mix(P.midc, P.near, .8));
  const inkC = mix(col, P.ink, .74), pale = mix(col, P.haze, .7), fog = mix(P.haze, col, .3);
  const far = z => smooth(0, 240, z);
  const shadeAt = z => { const fd = .06 + .6 * far(z); return c => css(mix(mix(c, fog, fd), dark, night)); };
  const inkAt = z => css(mix(inkC, fog, .7 * far(z)), .9);
  const fade = (near, k) => { const g = ctx.createLinearGradient(0, cam.hy, 0, cam.hy + (H - cam.hy) * .6); g.addColorStop(0, css(mix(near, fog, k))); g.addColorStop(1, css(near)); return g; };
  ctx.fillStyle = fade(col, .75); ctx.fillRect(0, cam.hy, W, H - cam.hy);
  const zb = cam.z0 * .45, yb = py(0, zb);
  const wedge = X => { ctx.beginPath(); ctx.moveTo(cam.cx, cam.hy); ctx.lineTo(px(-X, zb), yb); ctx.lineTo(px(X, zb), yb); ctx.closePath(); ctx.fill(); };
  const pave = mix(mix(pale, col, .3), P.snow, P.cover * .65);
  const tar = mix(mix(mix(ASPHALT.map(v => v * (.28 + .72 * P.light)), col, .22), P.snow, P.cover * .55), P.ink, .25 * P.wet);
  ctx.fillStyle = fade(pave, .6); wedge(cam.B);
  ctx.fillStyle = fade(tar, .6); wedge(cam.RW);
  ctx.fillStyle = css(mix(pale, WHITE, .3), .65);          // centre line
  ctx.beginPath();
  for (let z = zb; z < cam.zf; z += 9) if (Math.abs(z + 2 - cam.isle) > 6) quad(px(-.13, z), py(0, z), px(.13, z), py(0, z), px(.13, z + 4), py(0, z + 4), px(-.13, z + 4), py(0, z + 4));
  ctx.fill();
  const ki = cam.f / cam.isle;                             // the island the great tree stands on
  ctx.fillStyle = css(mix(pave, fog, .2)); ctx.strokeStyle = inkAt(cam.isle); ctx.lineWidth = Math.max(.7, ki * .12);
  ctx.beginPath(); ctx.ellipse(px(0, cam.isle), py(0, cam.isle), ki * 1.5, ki * 1.5 * cam.h / cam.isle, 0, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.fillStyle = css(inkC, .92);
  for (const k of cam.kerbs) ctx.fill(k);
  ctx.strokeStyle = css(inkC, .45); ctx.lineWidth = Math.max(.8, u);
  ctx.beginPath();
  for (const sd of [-1, 1]) { ctx.moveTo(cam.cx, cam.hy); ctx.lineTo(px(sd * cam.B, zb), yb); }
  ctx.stroke();

  for (const o of blds) put(o, shadeAt((o.z1 + o.z2) / 2), inkAt(o.z1), P, time);

  for (const p of people) place(p);
  for (const c of cars) place(c);
  const items = objs.concat(people, cars).sort((a, b) => b.Z - a.Z);
  for (const o of items) put(o, shadeAt(o.Z), inkAt(o.Z), P, time);

  drawSnow(P);
  drawRain(P);

  // soft vignette, like the edge of a painted sheet
  const v = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .45, W / 2, H * .5, Math.max(W, H) * .8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,10,.32)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// Townsfolk walk from door to door along their own pavement and stop a while at each;
// travellers walk the length of the street, and the traffic keeps to its lanes.
function step(dt) {
  const near = cam.z0 * .55;                               // past here a walker is below the bottom of the screen
  for (const p of people) {
    const rush = 1 + (p.runner ? 2.2 : .3) * wet;          // caught without an umbrella: run for it
    let moved = 0;
    if (!p.doors) {
      moved = p.speed * rush * dt; p.Z += p.vz * moved;
      if (p.Z < near) p.Z = 170; else if (p.Z > 170) p.Z = near;
    } else if (p.wait > 0) {
      p.wait -= dt * (1 + 2 * wet); p.moving = false;      // nobody lingers in the rain
      if (p.wait <= 0) p.tz = p.doors[(Math.random() * p.doors.length) | 0];
    } else {
      const d = p.tz - p.Z;
      if (Math.abs(d) < .1) p.wait = 1.5 + Math.random() * 5;
      else { p.vz = Math.sign(d); p.moving = true; moved = Math.min(Math.abs(d), p.speed * rush * dt); p.Z += p.vz * moved; }
    }
    p.ph += moved * 3.9 / p.size;
    p.dir = (p.X > 0 ? 1 : -1) * (p.vz < 0 ? 1 : -1);      // coming nearer means drifting outward on the screen
  }
  const slow = 1 - .3 * wet - .3 * cover;                  // traffic eases off in rain and snow
  for (const c of cars) {
    c.Z += c.vz * c.speed * slow * dt;
    if (c.Z < cam.z0 * .3) c.Z = 190; else if (c.Z > 190) c.Z = cam.z0 * .3;
  }
}

/* ---------- distortion ---------- */
// The pane cracks along rays and rings from the point of impact; each cell between them is a shard.
function layoutDistort() {
  const hx = dz.hx = W / 2, hy = dz.hy = H * .44;
  const far = dz.maxD = Math.hypot(Math.max(hx, W - hx), Math.max(hy, H - hy)) * 1.06;
  dz.Rf = Math.min(W, H) * .105;
  const NA = 15, radii = [];
  for (let r = 34 * u; r < far * .8; r *= lerp(1.55, 1.9, Math.random())) radii.push(r);
  radii.push(far);
  const NR = radii.length, ang = Array.from({ length: NA }, (_, i) => (i + (Math.random() - .5) * .6) / NA * 6.283);
  const V = ang.map(a => radii.map((r, j) => {
    const last = j === NR - 1, aa = a + (last ? 0 : (Math.random() - .5) * .12), rr = r * (last ? 1 : lerp(.86, 1.14, Math.random()));
    return [hx + Math.cos(aa) * rr, hy + Math.sin(aa) * rr];
  }));
  dz.shards = []; dz.cracks = [];
  const shard = pts => {
    const path = new Path2D();
    let cx = 0, cy = 0;
    pts.forEach((p, k) => { k ? path.lineTo(p[0], p[1]) : path.moveTo(p[0], p[1]); cx += p[0] / pts.length; cy += p[1] / pts.length; });
    path.closePath();
    dz.shards.push({ path, cx, cy, j: Math.random(), sheen: Math.random(), dn: Math.min(1, Math.hypot(cx - hx, cy - hy) / far) });
  };
  const crack = (a, b, r1, r2) => dz.cracks.push([a[0], a[1], b[0], b[1], r1, r2]);
  for (let i = 0; i < NA; i++) {
    const i2 = (i + 1) % NA;
    shard([[hx, hy], V[i][0], V[i2][0]]);
    crack([hx, hy], V[i][0], 0, radii[0]);
    for (let j = 0; j < NR; j++) {
      if (Math.random() < .6) crack(V[i][j], V[i2][j], radii[j] * 1.02, radii[j] * 1.1);   // not every ring crack shows before the pane gives way
      if (j === NR - 1) break;
      crack(V[i][j], V[i][j + 1], radii[j], radii[j + 1]);
      const a = V[i][j], b = V[i2][j], c = V[i2][j + 1], d = V[i][j + 1];
      if (Math.random() < .45) {
        if (Math.random() < .5) { shard([a, b, c]); shard([a, c, d]); crack(a, c, radii[j], radii[j + 1]); }
        else { shard([a, b, d]); shard([b, c, d]); crack(b, d, radii[j], radii[j + 1]); }
      } else shard([a, b, c, d]);
    }
  }
  dz.shards.sort((a, b) => b.dn - a.dn);                   // the far ones first, so nearer pieces fly over them
}

function initHole() {
  const R = Math.random;
  dz.disk = Array.from({ length: 560 }, () => {             // streaks of the accretion disk, in units of the shadow's radius
    const rho = 1.45 + 3.7 * Math.pow(R(), 1.7);
    return { rho, a: R() * 6.283, len: lerp(.12, .95, R()), w: 1.25 / Math.pow(rho, 1.5), lw: lerp(.012, .05, R() * R()), b: lerp(.07, .36, R()) };
  });
  dz.halo = Array.from({ length: 170 }, () => {             // the far side of the disk, bent round the shadow by its gravity
    const r = 1.05 + .62 * Math.pow(R(), 2.1);
    return { r, a: R() * 6.283, len: lerp(.2, 1.2, R()), w: .3 / Math.pow(r, 1.5), lw: lerp(.01, .035, R()), b: lerp(.08, .42, R()) };
  });
  dz.stars = Array.from({ length: 560 }, () => ({ a: R() * 6.283, d: Math.sqrt(R()) * 1.05, r: lerp(.5, 2, R() * R()), ph: R() * 6.28, sp: lerp(.5, 2.2, R()), hue: R() < .7 ? 220 : 35, sat: R() * 60 }));
  dz.sparks = Array.from({ length: 46 }, () => ({ ph: R(), a0: R() * 6.283, sp: lerp(.04, .1, R()), turns: lerp(1.2, 2.6, R()) }));
  dz.neb = [[R(), R(), 255, 90, 40], [R(), R(), 70, 40, 150], [R(), R(), 30, 70, 150]];
}

function startDistort(at) {
  dz.on = true; dz.gen++; dz.t = at || 0; dz.restoring = 0;
  layoutDistort();
  if (!dz.disk) initHole();
  dz.bits = at ? [] : Array.from({ length: 90 }, () => {    // splinters thrown out by the impact
    const a = Math.random() * 6.283, v = lerp(80, 620, Math.random()) * u;
    return { x: dz.hx, y: dz.hy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120 * u, rot: Math.random() * 6.283, vr: (Math.random() - .5) * 14, sz: lerp(2, 7, Math.random()) * u };
  });
  if (santa.t < 0) { santa.t = .3; santa.dir = Math.random() < .5 ? -1 : 1; santa.y0 = H * .15; }   // Santa is caught on his rounds
}
const holeR = () => dz.Rf * Math.pow(clamp((dz.t - 1.1) / 12, 0, 1), .62) * (1 + .012 * Math.sin(dz.t * .9));

function drawSpace(time, R, a) {
  if (a <= 0) return;
  const far = dz.maxD;
  ctx.globalCompositeOperation = 'lighter';
  for (const [nx, ny, r, g, b] of dz.neb) {
    const x = nx * W, y = ny * H, rr = Math.max(W, H) * .55, gr = ctx.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, `rgba(${r},${g},${b},${.13 * a})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = gr; ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  const lens = 1.9 * R * 1.9 * R;
  for (const s of dz.stars) {                               // starlight is pushed outward round the hole
    const d0 = s.d * far + 2, d = d0 + lens / d0;
    if (d < R * 1.12) continue;
    const ang = s.a + time * .006;
    ctx.fillStyle = `hsla(${s.hue},${s.sat}%,90%,${a * (.4 + .6 * Math.sin(time * s.sp + s.ph) ** 2)})`;
    ctx.beginPath(); ctx.arc(dz.hx + Math.cos(ang) * d, dz.hy + Math.sin(ang) * d, s.r * u, 0, 6.283); ctx.fill();
  }
}

const TILT = .21;
function diskPass(R, time, vis, front) {
  ctx.save();                                              // the disk's soft body, one half at a time
  ctx.beginPath(); ctx.rect(-6 * R, front ? 0 : -3 * R, 12 * R, 3 * R); ctx.clip();
  ctx.scale(1, TILT);
  const g = ctx.createRadialGradient(0, 0, 1.35 * R, 0, 0, 5.3 * R);
  g.addColorStop(0, 'rgba(255,240,210,0)'); g.addColorStop(.04, `rgba(255,236,190,${(front ? .8 : .5) * vis})`); g.addColorStop(.25, `rgba(255,170,70,${(front ? .45 : .3) * vis})`);
  g.addColorStop(.6, `rgba(220,80,30,${.14 * vis})`); g.addColorStop(1, 'rgba(120,20,10,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 5.3 * R, 0, 6.283); ctx.arc(0, 0, 1.35 * R, 0, 6.283, true); ctx.fill();
  ctx.restore();
  ctx.lineCap = 'butt';
  for (const p of dz.disk) {                               // hot inner streaks orbit fastest; the approaching side burns brighter
    const a = (p.a + time * p.w) % 6.283, mid = a + p.len / 2;
    if ((Math.sin(mid) > 0) !== front) continue;
    const tn = (p.rho - 1.45) / 3.7, dop = 1 - .62 * Math.cos(mid);
    ctx.strokeStyle = `hsla(${lerp(46, 14, tn) | 0},100%,${clamp(lerp(86, 50, tn) + 9 * (dop - 1), 30, 96) | 0}%,${Math.min(1, p.b * dop * vis * (1 - tn * .55) * (front ? 1.7 : 1))})`;
    ctx.lineWidth = Math.max(.6, p.lw * R);
    ctx.beginPath(); ctx.ellipse(0, 0, p.rho * R, p.rho * R * TILT, 0, a, a + p.len); ctx.stroke();
  }
  for (const s of dz.sparks) {                             // loose matter spiralling in
    const p = (time * s.sp + s.ph) % 1, a = s.a0 + p * s.turns * 6.283;
    if ((Math.sin(a) > 0) !== front) continue;
    const rr = lerp(6.5, 1.4, p * p) * R;
    ctx.fillStyle = `rgba(255,220,170,${Math.sin(Math.PI * p) * .9 * vis})`;
    ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr * TILT, Math.max(.7, .022 * R), 0, 6.283); ctx.fill();
  }
}

// The black hole: glow, the far half of the disk, its lensed halo, the shadow
// with a photon ring, then the near half of the disk across the front.
function drawHole(R, time, vis) {
  if (R < .5 || vis <= 0) return;
  ctx.save();
  ctx.translate(dz.hx, dz.hy);
  ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(0, 0, R * .8, 0, 0, R * 6.5);
  g.addColorStop(0, `rgba(255,150,60,${.26 * vis})`); g.addColorStop(.35, `rgba(200,70,40,${.08 * vis})`); g.addColorStop(1, 'rgba(120,30,60,0)');
  ctx.fillStyle = g; ctx.fillRect(-R * 6.5, -R * 6.5, R * 13, R * 13);
  ctx.rotate(-.16);
  diskPass(R, time, vis, false);
  g = ctx.createRadialGradient(0, 0, R, 0, 0, R * 1.9);
  g.addColorStop(0, `rgba(255,214,150,${.42 * vis})`); g.addColorStop(1, 'rgba(255,140,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 1.9, 0, 6.283); ctx.fill();
  for (const h of dz.halo) {
    const a = (h.a + time * h.w) % 6.283, mid = a + h.len / 2, sn = Math.sin(mid), tn = (h.r - 1.05) / .62;
    const k = (.35 + .65 * Math.pow(Math.abs(sn), .7)) * (sn < 0 ? 1 : .55) * (1 - .45 * Math.cos(mid));
    ctx.strokeStyle = `hsla(${lerp(50, 26, tn) | 0},100%,${lerp(92, 62, tn) | 0}%,${Math.min(1, h.b * k * vis * (1 - tn * .6))})`;
    ctx.lineWidth = Math.max(.6, h.lw * R);
    ctx.beginPath(); ctx.arc(0, 0, h.r * R, a, a + h.len); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(255,190,110,${.28 * vis})`; ctx.lineWidth = Math.max(1.5, R * .09);
  ctx.beginPath(); ctx.arc(0, 0, R * 1.03, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = `rgba(255,244,220,${.95 * vis})`; ctx.lineWidth = Math.max(.8, R * .028);
  ctx.beginPath(); ctx.arc(0, 0, R * 1.015, 0, 6.283); ctx.stroke();
  diskPass(R, time, vis, true);
  ctx.restore();
}

function drawCracks(T) {
  const F = dz.maxD * Math.pow(clamp(T / .8, 0, 1), .75);
  const path = new Path2D();
  for (const [x1, y1, x2, y2, r1, r2] of dz.cracks) {
    if (F <= r1) continue;
    const f = clamp((F - r1) / (r2 - r1), 0, 1);
    path.moveTo(x1, y1); path.lineTo(lerp(x1, x2, f), lerp(y1, y2, f));
  }
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.save(); ctx.translate(1.3, 1.3); ctx.strokeStyle = 'rgba(10,16,30,.55)'; ctx.lineWidth = 1.6; ctx.stroke(path); ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 4; ctx.stroke(path);
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.1; ctx.stroke(path);
  const g = ctx.createRadialGradient(dz.hx, dz.hy, 0, dz.hx, dz.hy, 44 * u);   // the crazed spot where it was struck
  g.addColorStop(0, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(dz.hx - 44 * u, dz.hy - 44 * u, 88 * u, 88 * u);
}

function drawShards(T) {
  const g = smooth(CRACK, 2.6, T);
  ctx.lineJoin = 'round';
  for (const s of dz.shards) {
    const rel = 7.4 + 4.2 * s.dn + s.j * .7;
    ctx.save();
    if (T >= rel) {
      const p = (T - rel) / (1.8 + 1.3 * s.dn);
      if (p >= 1) { ctx.restore(); continue; }
      const sp = spiral(s.cx, s.cy, p, s.j, s.cx, s.cy);
      // carry on from where the loose shard was hanging
      applySuck(sp);
      ctx.translate(s.cx, s.cy); ctx.rotate(s.rot0 || 0); ctx.translate(-s.cx, -s.cy);
    } else {                                               // hanging loose: eased apart, then leaning toward the hole
      const dx = s.cx - dz.hx, dy = s.cy - dz.hy, d = Math.hypot(dx, dy) || 1, tug = smooth(2.5, rel, T);
      const push = g * (2 + 5 * s.j) * u * (1 + 60 * u / (d + 40 * u)) - tug * d * .03;
      s.rot0 = (s.j - .5) * .07 * g + tug * .06 * (s.sheen - .5);
      ctx.translate(s.cx + dx / d * push, s.cy + dy / d * push); ctx.rotate(s.rot0); ctx.translate(-s.cx, -s.cy);
    }
    ctx.clip(s.path);
    ctx.drawImage(sc, 0, 0, W, H);
    if (s.sheen > .6) { ctx.fillStyle = `rgba(255,255,255,${.09 * g * (s.sheen - .6) / .4})`; ctx.fill(s.path); }
    ctx.strokeStyle = `rgba(255,255,255,${.5 * g})`; ctx.lineWidth = 2; ctx.stroke(s.path);
    ctx.restore();
  }
}

function drawBits(dt, R) {
  if (!dz.bits.length) return;
  const T = dz.t;
  ctx.fillStyle = 'rgba(225,238,255,.6)';
  for (const b of dz.bits) {
    if (T < 2) { b.vy += 520 * u * dt; b.vx *= 1 - .6 * dt; }
    else {
      const dx = dz.hx - b.x, dy = dz.hy - b.y, d = Math.hypot(dx, dy) || 1, pull = 1500 * u * Math.min(1, (T - 2) / 2);
      b.vx += (dx / d * pull - dy / d * pull * .5) * dt; b.vy += (dy / d * pull + dx / d * pull * .5) * dt;
      b.vx *= 1 - 1.2 * dt; b.vy *= 1 - 1.2 * dt;
      if (d < R + 6 * u) b.dead = true;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    const c = Math.cos(b.rot) * b.sz, sn = Math.sin(b.rot) * b.sz;
    ctx.beginPath(); ctx.moveTo(b.x + c, b.y + sn); ctx.lineTo(b.x - sn * .6, b.y + c * .6); ctx.lineTo(b.x - c * .7, b.y - sn * .7); ctx.closePath(); ctx.fill();
  }
  dz.bits = dz.bits.filter(b => !b.dead);
}

// One frame of the distortion: space behind, the broken pane with the live
// scene still on it, whatever is in flight, and the hole over everything.
function composite(time, dt, P) {
  const T = dz.t, R = holeR();
  ctx = main;
  ctx.save();
  if (T < .7) { const k = (1 - T / .7) * 8 * u; ctx.translate((Math.random() - .5) * k, (Math.random() - .5) * k); }   // the blow shakes the page
  ctx.fillStyle = '#000'; ctx.fillRect(-20, -20, W + 40, H + 40);
  if (T >= CRACK) drawSpace(time, R, smooth(CRACK, 3.5, T));
  if (T < dz.tEnd) {
    if (T < CRACK) { ctx.drawImage(sc, 0, 0, W, H); drawCracks(T); }
    else drawShards(T);
    for (const [s, o, shade, ink] of flying) { ctx.save(); applySuck(s); drawObj(o, shade, ink, P, time); ctx.restore(); }
  }
  drawHole(R, time, smooth(1, 3.5, T));
  drawBits(dt, R);
  if (T < .3) { ctx.fillStyle = `rgba(255,255,255,${.75 * (1 - T / .3)})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
}

/* ---------- clock + controls ---------- */
const $ = id => document.getElementById(id);
const clockEl = $('clock'), phaseEl = $('phase'), slider = $('time'), liveBtn = $('live'), cycleBtn = $('cycle'), panel = $('panel');
const fireBtn = $('fire'), seasonBtn = $('season'), snowBtn = $('snow'), xmasBtn = $('xmas'), rainBtn = $('rain'), distortBtn = $('distort');
const nowHours = () => { const n = new Date(); return n.getHours() + n.getMinutes() / 60 + n.getSeconds() / 3600; };
const setMode = () => {
  liveBtn.classList.toggle('on', override === null); cycleBtn.classList.toggle('on', cycling);
  fireBtn.classList.toggle('on', fireworksOn); snowBtn.classList.toggle('on', snowOn); xmasBtn.classList.toggle('on', xmasOn);
  rainBtn.classList.toggle('on', rainOn);
  seasonBtn.textContent = 'Season: ' + (seasonSel === 'auto' ? 'auto (' + season() + ')' : seasonSel);
  distortBtn.textContent = dz.on ? 'Restore' : 'Distort';
  panel.classList.toggle('void', dz.on);
};

slider.addEventListener('input', () => { override = +slider.value % 24; cycling = false; setMode(); });
liveBtn.addEventListener('click', () => { override = null; cycling = false; setMode(); });
cycleBtn.addEventListener('click', () => { cycling = !cycling; if (cycling && override === null) override = nowHours(); setMode(); });
fireBtn.addEventListener('click', () => { fireworksOn = !fireworksOn; setMode(); });
seasonBtn.addEventListener('click', () => {
  const order = ['auto', ...SEASONS];
  seasonSel = order[(order.indexOf(seasonSel) + 1) % order.length];
  snowOn = season() === 'winter';                       // winter brings its own snow; the Snow button overrides
  if (snowOn) rainOn = false;
  buildCaps(); setMode();
});
snowBtn.addEventListener('click', () => { snowOn = !snowOn; if (snowOn) rainOn = false; setMode(); });
rainBtn.addEventListener('click', () => { rainOn = !rainOn; if (rainOn) snowOn = false; setMode(); });
xmasBtn.addEventListener('click', () => { xmasOn = !xmasOn; setMode(); });
$('regen').addEventListener('click', () => { seed = (Math.random() * 1e9) | 0; build(); });
distortBtn.addEventListener('click', () => {
  if (dz.on) { dz.on = false; dz.restoring = 1.6; santa.t = -1; santa.next = lerp(6, 14, Math.random()); }   // the hole closes and the city returns
  else startDistort();
  setMode();
});
addEventListener('keydown', e => {
  if (e.target === slider) return;
  const k = e.key.toLowerCase();
  if (dz.on && k !== 'd') return;
  const b = { r: $('regen'), l: liveBtn, c: cycleBtn, f: fireBtn, s: seasonBtn, n: snowBtn, x: xmasBtn, w: rainBtn, d: distortBtn }[k];
  if (b) b.click();
});
$('menu').addEventListener('click', e => {
  const open = panel.classList.toggle('open');
  e.currentTarget.textContent = open ? 'Close' : 'Controls'; e.currentTarget.setAttribute('aria-expanded', open);
});
// Rebuild on a real resize or rotation, but not when a phone's address bar slides in and out.
let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (Math.ceil(window.innerWidth) !== W || Math.abs(window.innerHeight - H) > 120) build();
  }, 150);
});

let last = performance.now(), lastLabel = '';
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000), time = now / 1000; last = now;
  if (cycling) override = (override + dt * 24 / 60) % 24;
  const t = override === null ? nowHours() : override;
  const P = paletteAt(t);
  stepWeather(dt, time);
  applySeason(P);
  step(dt);
  stepSky(dt, P);
  stepFireworks(dt, P.night);
  if (dz.on) {
    dz.t += dt;
    flying.length = 0;
    if (dz.t < dz.tEnd) { ctx = sctx; draw(t, time, P); }
    composite(time, dt, P);
  } else {
    ctx = main;
    draw(t, time, P);
    if (dz.restoring > 0) {
      const k = dz.restoring / 1.6;
      ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H);
      drawHole(dz.Rf * k * k, time, k);
      dz.restoring -= dt;
    }
  }
  const label = String(t | 0).padStart(2, '0') + ':' + String((t % 1) * 60 | 0).padStart(2, '0');
  if (label !== lastLabel) {
    lastLabel = label; clockEl.textContent = label; phaseEl.textContent = phaseName(t);
    if (document.activeElement !== slider) slider.value = t;
  }
  requestAnimationFrame(frame);
}

if (qs.get('ui') === '0') panel.style.display = 'none';   // clean view for screenshots
build();
if (qs.has('dz')) startDistort(Math.max(.01, +qs.get('dz') || 0));   // open part-way through the distortion
setMode();
frame(performance.now());
})();
</script>
</body>
</html>
